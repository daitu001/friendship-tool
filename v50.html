// ===== 保存 → 本地+云端双备份 =====
async function saveData() {
  const validRows = rows.filter(r => r.origMeters > 0 && r.rate !== '');
  if (validRows.length === 0) { showToast('没有数据可保存'); return; }
  const customer = document.getElementById('globalCustomer').value.trim();
  const orderCode = document.getElementById('globalColorCode').value.trim();
  if (!customer) { showToast('请填写客户名称'); document.getElementById('globalCustomer').focus(); return; }

  const today = new Date();
  const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const timeStr = String(today.getHours()).padStart(2,'0') + ':' + String(today.getMinutes()).padStart(2,'0');

  const snapshot = {
    id: Date.now(),
    date: dateStr,
    time: timeStr,
    customer: customer,
    orderNo: orderCode,
    rows: validRows.map(r => ({ colorCode: r.colorCode||'', selfCode: r.selfCode||'', origMeters: r.origMeters, rate: r.rate })),
    delivered: false,
    remark: ''
  };

  // 读取已有历史
  let history = [];
  try { history = JSON.parse(localStorage.getItem('meterConverterHistory') || '[]'); } catch(e){}
  history.push(snapshot);
  localStorage.setItem('meterConverterHistory', JSON.stringify(history));

  // 保存当前工作区快照
  const workData = {
    globalRate: document.getElementById('globalRate').value,
    rateMode: rateMode,
    globalCustomer: customer,
    globalColorCode: orderCode,
    rows: rows,
    idCounter: idCounter
  };
  localStorage.setItem('meterConverterData', JSON.stringify(workData));

  // 云端同步
  await Promise.all([ossSaveWorkData(workData), ossSaveHistory(history)]);

  // 保存成功后自动清空产品数据，准备输入下一个客户
  rows = [];
  idCounter = 0;
  document.getElementById('globalColorCode').value = '';
  // 客户名不清空（通常连续给同一客户下单）
  render();
  // 保存清空后的工作区状态
  const clearedWorkData = {
    globalRate: document.getElementById('globalRate').value,
    rateMode: rateMode,
    globalCustomer: customer,
    globalColorCode: '',
    rows: [],
    idCounter: 0
  };
  localStorage.setItem('meterConverterData', JSON.stringify(clearedWorkData));
  ossSaveWorkData(clearedWorkData);

  // 保存客户名称到自动补全列表（标记来源为手动编）
  if (customer) {
    var customers = JSON.parse(localStorage.getItem('customerNames') || '[]');
    if (customers.indexOf(customer) === -1) {
      customers.push(customer);
    }
    localStorage.setItem('customerNames', JSON.stringify(customers));
  }
  
  // 保存工厂名称映射到本地（标记为手动编）
  var fFactory = document.getElementById('fFactory')?.value.trim() || '';
  var fFactoryCode = document.getElementById('fFactoryCode')?.value.trim() || '';
  if (fFactory && fFactoryCode) {
    var localFactoryNames = JSON.parse(localStorage.getItem('factoryNameList') || '[]');
    if (!localFactoryNames.find(function(n) { return n.name === fFactory; })) {
      localFactoryNames.push({ name: fFactory, code: fFactoryCode, source: '手动编' });
      localStorage.setItem('factoryNameList', JSON.stringify(localFactoryNames));
    }
  }

  // === 同步数据到共享存储 ===
  (function() {
    if (typeof FriendshipSync === 'undefined') return;
    
    // 同步客户名称
    if (customer && typeof FriendshipSync.syncCustomer === 'function') {
      FriendshipSync.syncCustomer(customer);
    }
    
    var syncColors = {};
    var syncProducts = {};
    
    // 从快照的rows中提取色号和工厂色号
    var orderCode = document.getElementById('globalColorCode')?.value.trim() || '';
    validRows.forEach(function(r) {
      // selfCode = 自编色号, colorCode = 工厂色号
      if (r.selfCode) {
        syncColors[r.selfCode] = {
          colorCode: r.selfCode,
          factoryColor: r.colorCode || '',
          productCode: orderCode || '',
          updatedBy: 'v50Tool',
          updatedAt: new Date().toISOString()
        };
      }
    });
    
    // 同步产品（使用订单号作为产品编号）
    if (orderCode) {
      syncProducts[orderCode] = {
        productCode: orderCode,
        productName: '',
        factory: '',
        factoryCode: '',
        updatedBy: 'v50Tool',
        updatedAt: new Date().toISOString()
      };
    }
    
    FriendshipSync.syncBatch(syncProducts, syncColors, null);
    
    // 同步工厂名称映射和色号映射（土土协作内部使用）
    var syncFactoryNameMappings = {};
    var syncFactoryColorMappings = {};
    var currentFactory = document.getElementById('fFactory')?.value.trim() || '';
    var currentFactoryCode = document.getElementById('fFactoryCode')?.value.trim() || '';
    if (currentFactory && currentFactoryCode) {
      syncFactoryNameMappings[currentFactory] = {
        code: currentFactoryCode,
        updatedBy: 'tutuCollab',
        updatedAt: new Date().toISOString()
      };
    }
    // 从rows提取色号映射
    validRows.forEach(function(r) {
      if (currentFactoryCode && r.colorCode) {
        var key = currentFactoryCode + '_' + r.colorCode;
        syncFactoryColorMappings[key] = {
          factoryCode: currentFactoryCode,
          factoryColor: r.colorCode,
          colorCardNo: orderCode || '',
          colorCardColor: r.selfCode || '',
          updatedBy: 'tutuCollab',
          updatedAt: new Date().toISOString()
        };
      }
    });
    if (Object.keys(syncFactoryNameMappings).length > 0) {
      FriendshipSync.syncFactoryNameMapBatch(syncFactoryNameMappings);
    }
    if (Object.keys(syncFactoryColorMappings).length > 0) {
      FriendshipSync.syncFactoryColorMapBatch(syncFactoryColorMappings);
    }
    
    console.log('[FriendshipSync] 大货工具数据已同步:', Object.keys(syncProducts).length, '个产品,', Object.keys(syncColors).length, '个色号,', Object.keys(syncFactoryNameMappings).length, '个工厂名映射,', Object.keys(syncFactoryColorMappings).length, '个色号映射');
  })();
  
  showToast('已保存并同步云端（' + customer + ' ' + timeStr + '）');
}

function loadData() {
  const saved = localStorage.getItem('meterConverterData');
  if (!saved) return false;
  try {
    const data = JSON.parse(saved);
    if (data.rateMode === 'strip') data.rateMode = 'meter';
    const modeDefaults2 = { meter: '0.965', kg: '2', yard: '0' };
    const defaultRate2 = modeDefaults2[data.rateMode] || '0.965';
    if (data.globalRate && data.globalRate !== defaultRate2) {
      data.globalRate = defaultRate2;
    }
    document.getElementById('globalRate').value = data.globalRate || defaultRate2;
    if (data.rateMode) { rateMode = data.rateMode; syncRateUI(); }
    document.getElementById('globalCustomer').value = data.globalCustomer || '';
    document.getElementById('globalColorCode').value = data.globalColorCode || '';
    rows = data.rows || []; idCounter = data.idCounter || 0;
    return rows.length > 0;
  } catch(e) { return false; }
}

function clearData() {
  if (!confirm('确定清空当前工作区数据吗？历史记录将保留。')) return;
  rows = []; idCounter = 0;
  document.getElementById('globalRate').value = '0.965';
  document.getElementById('globalCustomer').value = '';
  document.getElementById('globalColorCode').value = '';
  // 清除工作区（保留历史记录）
  localStorage.removeItem('meterConverterData');
  // 同步清除云端
  ossSaveWorkData({
    globalRate: '0.965',
    rateMode: rateMode,
    globalCustomer: '',
    globalColorCode: '',
    rows: [],
    idCounter: 0
  });
  render();
  showToast('工作区已清空');
}

function openHistory() {
  document.getElementById('historyPage').classList.add('show');
  const history = getHistory();
  if (history.length > 0) {
    const allDates = [...new Set(history.map(h=>h.date))].sort();
    document.getElementById('hDateFrom').value = allDates[0];
    document.getElementById('hDateTo').value = allDates[allDates.length-1];
  }
  // 默认激活未配送筛选
  historyUndeliveredOnly = true;
  historyDeliveredOnly = false;
  document.getElementById('hFilterUndelivered').style.background = '#000';
  document.getElementById('hFilterDelivered').style.background = '#444';
  renderHistoryDateList();
}

function closeHistory() {
  document.getElementById('historyPage').classList.remove('show');
  // 关闭时重置筛选状态，下次打开默认未配送
  historyUndeliveredOnly = false;
  historyDeliveredOnly = false;
}

function getHistory() {
  try { 
    let h = JSON.parse(localStorage.getItem('meterConverterHistory') || '[]'); 
    h.forEach(r => { if (r.delivered === undefined) r.delivered = false; });
    return h; 
  } catch(e) { return []; }
}

function getFilteredHistory() {
  const from = document.getElementById('hDateFrom').value;
  const to = document.getElementById('hDateTo').value;
  let history = getHistory();
  // 给缺少 delivered 字段的记录补默认值 false
  history.forEach(h => { if (h.delivered === undefined) h.delivered = false; });
  if (from && to) history = history.filter(h => h.date >= from && h.date <= to);
  return history;
}

function applyHistoryFilter() {
  const from = document.getElementById('hDateFrom').value;
  const to = document.getElementById('hDateTo').value;
  if (!from || !to) { showToast('请选择日期范围'); return; }
  document.getElementById('hPage1').style.display = 'block';
  document.getElementById('hPage2').style.display = 'none';
  document.getElementById('hPage3').style.display = 'none';
  document.getElementById('hSearchInput').value = '';
  renderHistoryDateList();
}

function resetHistoryFilter() {
  const history = getHistory();
  if (history.length > 0) {
    const allDates = [...new Set(history.map(h=>h.date))].sort();
    document.getElementById('hDateFrom').value = allDates[0];
    document.getElementById('hDateTo').value = allDates[allDates.length-1];
  }
  document.getElementById('hSearchInput').value = '';
  // 重置筛选状态
  historyUndeliveredOnly = false;
  historyDeliveredOnly = false;
  document.getElementById('hFilterUndelivered').style.background = '#222';
  document.getElementById('hFilterDelivered').style.background = '#222';
  document.getElementById('hPage1').style.display = 'block';
  document.getElementById('hPage2').style.display = 'none';
  document.getElementById('hPage3').style.display = 'none';
  renderHistoryDateList();
}

let historyUndeliveredOnly = false;
let historyDeliveredOnly = false;
function refreshHistoryView() {
  if (document.getElementById('hPage2').style.display === 'block') {
    const dateTitle = document.getElementById('hPageTitle').textContent;
    const date = dateTitle.split(' ')[0];
    openHistoryDate(date);
  } else {
    renderHistoryDateList();
  }
}
function toggleHistoryUndelivered() {
  historyUndeliveredOnly = true;
  historyDeliveredOnly = false;
  document.getElementById('hFilterUndelivered').style.background = '#000';
  document.getElementById('hFilterDelivered').style.background = '#444';
  refreshHistoryView();
}
function toggleHistoryDelivered() {
  historyDeliveredOnly = true;
  historyUndeliveredOnly = false;
  document.getElementById('hFilterDelivered').style.background = '#000';
  document.getElementById('hFilterUndelivered').style.background = '#444';
  refreshHistoryView();
}

function toggleRecordDelivered(id, evt) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  let history = getHistory();
  const record = history.find(h => h.id === id);
  if (!record) return;
  record.delivered = !record.delivered;
  localStorage.setItem('meterConverterHistory', JSON.stringify(history));
  // 后台保存云端（不阻塞界面）
  ossSaveHistory(history);
  // 保存当前展开的客户卡片
  saveExpandedCustomers();
  // 直接从已更新的localStorage重新读取，确保数据一致
  const freshHistory = getHistory();
  const dateTitle = document.getElementById('hPageTitle').textContent;
  const curDate = dateTitle.split(' ')[0];
  const dayRecords = freshHistory.filter(h => h.date === curDate);
  const allDone = dayRecords.every(h => h.delivered);
  // 确保详情页保持显示
  document.getElementById('hPage1').style.display = 'none';
  document.getElementById('hPage3').style.display = 'none';
  document.getElementById('hPage2').style.display = 'block';
  if (allDone) {
    // 全部完成，跳回日期列表
    setTimeout(function() {
      document.getElementById('hPage2').style.display = 'none';
      document.getElementById('hPage1').style.display = 'block';
      renderHistoryDateList();
    }, 300);
  } else {
    // 还有未完成，留在当前详情页刷新内容
    openHistoryDate(curDate);
  }
}

function renderHistoryDateList() {
  let history = getFilteredHistory();
  const byDate = {};
  history.forEach(h => {
    if (!byDate[h.date]) byDate[h.date] = [];
    byDate[h.date].push(h);
  });
  let sortedDates = Object.keys(byDate).sort().reverse();
  // 未配送模式：排除已全部完成的日期
  if (historyUndeliveredOnly) {
    sortedDates = sortedDates.filter(date => !byDate[date].every(i => i.delivered));
  }
  // 已配送模式：只显示有已配送记录的日期
  if (historyDeliveredOnly) {
    sortedDates = sortedDates.filter(date => byDate[date].some(i => i.delivered));
  }

  if (sortedDates.length === 0) {
    document.getElementById('hDateList').innerHTML = '';
    document.getElementById('hNoResult1').style.display = 'block';
    return;
  }
  document.getElementById('hNoResult1').style.display = 'none';

  let html = '';
  sortedDates.forEach(date => {
    const items = byDate[date];
    const custNames = [...new Set(items.map(i=>i.customer))];
    const weekday = ['周日','周一','周二','周三','周四','周五','周六'][new Date(date).getDay()];
    html += '<div class="h-date-card" onclick="openHistoryDate(\'' + date + '\')">' +
      '<div><div class="h-date-text">' + date + ' ' + weekday + (historyUndeliveredOnly ? ' <span style="color:#fa8c16;font-size:12px;margin-left:4px;">未完成配送任务</span>' : historyDeliveredOnly ? ' <span style="color:#52c41a;font-size:12px;margin-left:4px;">已完成配送</span>' : '') + (items.every(i=>i.delivered) ? ' <span style="color:#52c41a;font-size:12px;">✅已配送</span>' : items.some(i=>i.delivered) ? ' <span style="color:#fa8c16;font-size:12px;">⏳部分</span>' : '') + '</div>' +
      '<div class="h-count-text">' + custNames.length + ' 位客户 · ' + items.length + ' 单订单</div></div>' +
      '<div class="h-arrow">›</div></div>';
  });
  document.getElementById('hDateList').innerHTML = html;
}

function openHistoryDate(date) {
  document.getElementById('hPage1').style.display = 'none';
  document.getElementById('hPage3').style.display = 'none';
  document.getElementById('hPage2').style.display = 'block';
  const weekday = ['周日','周一','周二','周三','周四','周五','周六'][new Date(date).getDay()];
  let titleText = date + ' ' + weekday;
  if (historyUndeliveredOnly) titleText += ' 未完成配送任务';
  else if (historyDeliveredOnly) titleText += ' 已完成配送';
  document.getElementById('hPageTitle').textContent = titleText;

  let history = getFilteredHistory().filter(h=>h.date===date);
  // 未配送模式：只显示未完成的记录
  if (historyUndeliveredOnly) history = history.filter(h => !h.delivered);
  // 已配送模式：只显示已配送的记录
  if (historyDeliveredOnly) history = history.filter(h => h.delivered);
  const byCust = {};
  history.forEach(h => {
    if (!byCust[h.customer]) byCust[h.customer] = [];
    byCust[h.customer].push(h);
  });

  let html = '';
  Object.keys(byCust).sort().forEach(cust => {
    const records = byCust[cust];
    const totalRows = records.reduce((s,r)=>s+r.rows.length,0);
    html += '<div class="h-cust-card">' +
      '<div class="h-cust-header" onclick="toggleHCust(this)">' +
      '<div><div class="h-cust-name">' + cust + '</div><div class="h-cust-info">' + records.length + ' 单 · ' + totalRows + ' 条</div></div>' +
      '<div class="h-arrow">›</div></div>' +
      '<div class="h-cust-detail">' + buildHistoryDetail(records) + '</div></div>';
  });
  document.getElementById('hCustomerList').innerHTML = html;
  // 恢复之前展开的客户卡片
  if (window._expandedCustomers && window._expandedCustomers.length > 0) {
    setTimeout(function() {
      document.querySelectorAll('#hCustomerList .h-cust-card').forEach(function(card) {
        var nameEl = card.querySelector('.h-cust-name');
        if (nameEl && window._expandedCustomers.indexOf(nameEl.textContent.trim()) !== -1) {
          var header = card.querySelector('.h-cust-header');
          if (header && !header.classList.contains('expanded')) {
            header.classList.add('expanded');
            var detail = header.nextElementSibling;
            if (detail) detail.classList.add('show');
          }
        }
      });
    }, 0);
  }
}

function buildHistoryDetail(records) {
  let html = '';
  records.forEach(record => {
    html += '<div class="h-record">';
    // 按钮行
    html += '<div class="h-record-btns" style="justify-content:center;">';
    if (historyUndeliveredOnly) {
      html += '<button class="h-record-done" style="background:#EAF5EA;color:#52c41a;border:1px solid #52c41a;border-radius:3px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-right:4px;" onclick="toggleRecordDelivered(' + record.id + ', event)">完成</button>';
    } else if (historyDeliveredOnly) {
      html += '<button class="h-record-done" style="background:#52c41a;color:#fff;border:1px solid #52c41a;border-radius:3px;padding:4px 12px;font-size:12px;font-weight:600;margin-right:4px;opacity:0.8;cursor:default;" disabled>✅ 完成配送</button>';
    } else {
      if (record.delivered) {
        html += '<button class="h-record-done" style="background:#52c41a;color:#fff;border:1px solid #52c41a;border-radius:3px;padding:4px 12px;font-size:12px;font-weight:600;margin-right:4px;opacity:0.8;cursor:default;" disabled>✅ 完成配送</button>';
      } else {
        html += '<button class="h-record-done" style="background:#EAF5EA;color:#52c41a;border:1px solid #52c41a;border-radius:3px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-right:4px;" onclick="toggleRecordDelivered(' + record.id + ', event)">完成</button>';
      }
    }
    html += '<button class="h-record-remark" style="background:#fff;color:#e67e22;border:1px solid #e67e22;border-radius:3px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;margin-right:4px;" onclick="openRemarkModal(' + record.id + ')">备注款号</button>';
    html += '<button class="h-record-edit" onclick="editHistoryRecord(' + record.id + ')">修改</button>';
    html += '<button class="h-record-del" onclick="deleteHistoryRecord(' + record.id + ')">删除</button>';
    html += '</div>';
    // 下单编号在按钮下面，居中，大字体
    if (record.orderNo) {
      html += '<div style="text-align:center;margin:6px 0;"><span style="font-size:13px;color:#666;">下单编号：</span><span style="font-size:18px;font-weight:700;color:#1677ff;">' + escapeHtml(record.orderNo) + '</span></div>';
    } else if (record.time) {
      html += '<div style="text-align:center;margin:6px 0;"><span style="font-size:13px;color:#666;">下单编号：</span><span style="font-size:18px;font-weight:700;color:#1677ff;">' + record.time + '</span></div>';
    }
    // 表格表头
    html += '<div style="display:flex;padding:4px 0;margin-top:6px;border-bottom:1px solid #ddd;font-size:11px;color:#999;font-weight:500;">' +
      '<div style="flex:1;text-align:center;">顺序</div>' +
      '<div style="flex:1;text-align:center;">色号</div>' +
      '<div style="flex:1;text-align:center;">工厂米数</div>' +
      '<div style="flex:1;text-align:center;">换算米数</div></div>';
    record.rows.forEach((r, j) => {
      const conv = calcConverted(r.origMeters, r.rate);
      html += '<div style="display:flex;padding:3px 0;font-size:13px;color:#555;">' +
        '<div style="flex:1;text-align:center;color:#888;">' + (j+1) + '</div>' +
        '<div style="flex:1;text-align:center;font-weight:500;">' + (r.colorCode||'-') + '</div>' +
        '<div style="flex:1;text-align:center;color:#ff4d4f;font-weight:600;">' + r.origMeters + '</div>' +
        '<div style="flex:1;text-align:center;color:#333;font-weight:600;">' + conv + '</div></div>';
    });
    // 客户名称 + 客户款号 + 条数放底部
    if (record.remark || record.customer) {
      html += '<div style="margin-top:6px;padding-top:4px;border-top:1px dashed #ddd;font-size:12px;color:#e67e22;display:flex;justify-content:space-between;align-items:center;">' +
        '<span>客户名称：' + escapeHtml(record.customer||'') + '</span>' +
        (record.remark ? '<span>客户款号：' + escapeHtml(record.remark) + '</span>' : '<span></span>') +
        '<span>条数数量：' + record.rows.length + '条</span></div>';
    }
    html += '</div>';
  });
  return html;
}

function toggleHCust(el) {
  const card = el.parentElement;
  const detail = card.querySelector('.h-cust-detail');
  if (el.classList.contains('expanded')) { el.classList.remove('expanded'); detail.classList.remove('show'); }
  else { el.classList.add('expanded'); detail.classList.add('show'); }
  // 记录当前展开的客户
  saveExpandedCustomers();
}
function saveExpandedCustomers() {
  window._expandedCustomers = [];
  document.querySelectorAll('#hCustomerList .h-cust-header.expanded').forEach(function(header) {
    var nameEl = header.querySelector('.h-cust-name');
    if (nameEl) window._expandedCustomers.push(nameEl.textContent.trim());
  });
}

async function deleteHistoryRecord(id) {
  if (!confirm('确定要删除这条记录吗？')) return;
  let history = getHistory();
  history = history.filter(h => h.id !== id);
  localStorage.setItem('meterConverterHistory', JSON.stringify(history));
  await ossSaveHistory(history);
  showToast('已删除');
  saveExpandedCustomers();
  const dateTitle = document.getElementById('hPageTitle').textContent;
  const date = dateTitle.split(' ')[0];
  openHistoryDate(date);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function openRemarkModal(id) {
  const history = getHistory();
  const record = history.find(h => h.id === id);
  if (!record) { showToast('未找到该记录'); return; }
  // 移除已有弹窗
  const old = document.getElementById('remarkModalOverlay');
  if (old) old.remove();
  // 创建弹窗
  const overlay = document.createElement('div');
  overlay.id = 'remarkModalOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML = '<div style="background:#F5FBF5;border-radius:3px;padding:20px 18px;width:85%;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,0.18);">' +
    '<div style="font-size:16px;font-weight:700;margin-bottom:12px;color:#333;">📝 备注款号</div>' +
    '<input id="remarkInput" type="text" value="' + escapeHtml(record.remark || '') + '" placeholder="请输入备注款号" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #ddd;border-radius:3px;font-size:14px;outline:none;" />' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button id="remarkCancelBtn" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:3px;background:#f5f5f5;font-size:14px;font-weight:600;cursor:pointer;color:#666;">取消</button>' +
    '<button id="remarkSaveBtn" style="flex:1;padding:10px;border:none;border-radius:3px;background:#e67e22;font-size:14px;font-weight:600;cursor:pointer;color:#fff;">保存</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
  // 聚焦输入框
  setTimeout(function(){ document.getElementById('remarkInput').focus(); document.getElementById('remarkInput').select(); }, 100);
  // 绑定事件
  document.getElementById('remarkCancelBtn').addEventListener('click', function(){ overlay.remove(); });
  document.getElementById('remarkSaveBtn').addEventListener('click', function(){ saveRemark(id); });
  overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.remove(); });
  document.getElementById('remarkInput').addEventListener('keydown', function(e){ if(e.key==='Enter') saveRemark(id); });
}

async function saveRemark(id) {
  const input = document.getElementById('remarkInput');
  if (!input) return;
  const remark = input.value.trim();
  let history = getHistory();
  const record = history.find(h => h.id === id);
  if (!record) { showToast('未找到该记录'); return; }
  record.remark = remark;
  localStorage.setItem('meterConverterHistory', JSON.stringify(history));
  await ossSaveHistory(history);
  const overlay = document.getElementById('remarkModalOverlay');
  if (overlay) overlay.remove();
  showToast(remark ? '备注已保存' : '备注已清除');
  // 刷新当前详情
  saveExpandedCustomers();
  const dateTitle = document.getElementById('hPageTitle').textContent;
  const date = dateTitle.split(' ')[0];
  openHistoryDate(date);
}

function editHistoryRecord(id) {
  const history = getHistory();
  const record = history.find(h => h.id === id);
  if (!record) { showToast('未找到该记录'); return; }
  // 恢复主页面数据
  document.getElementById('globalCustomer').value = record.customer || '';
  document.getElementById('globalColorCode').value = record.orderNo || '';
  // 恢复行数据
  rows = [];
  idCounter = 0;
  record.rows.forEach(r => {
    addRowData(r.origMeters, r.rate, record.customer || '', r.colorCode || '', r.selfCode || '');
  });
  // 恢复全局空差率（取第一行的 rate）
  if (record.rows.length > 0) {
    document.getElementById('globalRate').value = record.rows[0].rate || 96;
  }
  render();
  saveData_silent();
  closeHistory();
  showToast('已恢复，可继续编辑');
}

function saveData_silent() {
  const validRows = rows.filter(r => r.origMeters > 0 && r.rate !== '');
  const customer = document.getElementById('globalCustomer').value.trim();
  const orderCode = document.getElementById('globalColorCode').value.trim();
  
  // === 静默同步数据到共享存储 ===
  (function() {
    if (typeof FriendshipSync === 'undefined') return;
    var syncColors = {};
    rows.forEach(function(r) {
      if (r.selfCode && r.origMeters > 0) {
        syncColors[r.selfCode] = {
          colorCode: r.selfCode,
          factoryColor: r.colorCode || '',
          productCode: orderCode || '',
          updatedBy: 'v50Tool',
          updatedAt: new Date().toISOString()
        };
      }
    });
    if (Object.keys(syncColors).length > 0) {
      FriendshipSync.syncBatch(null, syncColors, null);
    }
  })();
  
  const workData = {
    globalRate: document.getElementById('globalRate').value,
    globalCustomer: customer,
    globalColorCode: orderCode,
    rows: rows,
    idCounter: idCounter
  };
  localStorage.setItem('meterConverterData', JSON.stringify(workData));
}

function onHistorySearch() {
  const keyword = document.getElementById('hSearchInput').value.trim().toLowerCase();
  if (!keyword) {
    document.getElementById('hPage1').style.display = 'block';
    document.getElementById('hPage3').style.display = 'none';
    renderHistoryDateList();
    return;
  }
  const history = getFilteredHistory();
  const results = [];
  history.forEach(h => {
    let match = h.customer.toLowerCase().includes(keyword) || (h.orderNo||'').toLowerCase().includes(keyword);
    if (!match) match = h.rows.some(r => (r.colorCode||'').toLowerCase().includes(keyword) || (r.selfCode||'').toLowerCase().includes(keyword));
    if (match) results.push(h);
  });
  renderHistorySearchResults(keyword, results);
}

// 自动匹配工厂色号

function autoFillColorAlias(rowElement) {
  var selfCodeInput = rowElement.querySelector('input[data-field="selfCode"]');
  var colorCodeInput = rowElement.querySelector('input[data-field="colorCode"]');
  if (!selfCodeInput || !colorCodeInput) return;
  
  // 清除之前的提示面板
  var oldPanel = rowElement.querySelector('.color-helper-panel');
  if (oldPanel) oldPanel.remove();
  
  var selfCode = selfCodeInput.value.trim();
  if (!selfCode) return;
  
  // 获取产品编号
  var productCode = localStorage.getItem('currentProductCode') || '';
  if (!productCode) return;
  
  // 合并自定义映射
  var customMap = loadCustomColorMap();
  var baseColors = COLOR_ALIAS_MAP[productCode] || {};
  var productColors = Object.assign({}, baseColors, customMap[productCode] || {});
  
  // 1. 先精确匹配
  var alias = productColors[selfCode];
  
  // 2. 没找到就模糊匹配
  if (!alias) {
    for (var key in productColors) {
      if (key.indexOf(selfCode) === 0 || selfCode.indexOf(key) === 0) {
        alias = productColors[key];
        break;
      }
    }
  }
  
  if (alias) {
    colorCodeInput.value = alias;
    colorCodeInput.style.background = '#e6f7ff';
    setTimeout(function() { colorCodeInput.style.background = '#fff'; }, 1000);
  } else {
    // 没找到匹配，显示色号辅助面板
    showColorHelperPanel(rowElement, selfCodeInput, colorCodeInput, selfCode, productCode);
  }
}

// 加载自定义色号映射
function loadCustomColorMap() {
  try {
    var data = localStorage.getItem('customColorAliasMap');
    return data ? JSON.parse(data) : {};
  } catch(e) { return {}; }
}

// 保存自定义色号映射
function saveCustomColorMap(map) {
  localStorage.setItem('customColorAliasMap', JSON.stringify(map));
}

// 添加自定义色号映射
function addCustomColorAlias(productCode, selfCode, factoryColor) {
  var map = loadCustomColorMap();
  if (!map[productCode]) map[productCode] = {};
  map[productCode][selfCode] = factoryColor;
  saveCustomColorMap(map);
  // 同步更新内存中的 COLOR_ALIAS_MAP
  if (!COLOR_ALIAS_MAP[productCode]) COLOR_ALIAS_MAP[productCode] = {};
  COLOR_ALIAS_MAP[productCode][selfCode] = factoryColor;
}

// 激活粘贴模式
function activatePasteMode(btn) {
  btn.innerHTML = '<span>📋</span><span>等待粘贴中... (按Ctrl+V)</span>';
  btn.style.background = '#e8f5e9';
  btn.style.borderColor = '#4caf50';
  btn.style.color = '#4caf50';
  btn.disabled = true;

  // 添加一次性粘贴监听
  function onPaste(e) {
    e.preventDefault();
    var items = (e.clipboardData || e.originalEvent.clipboardData).items;
    var imageFile = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        imageFile = items[i].getAsFile();
        break;
      }
    }
    if (!imageFile) {
      showToast('未检测到图片，请先复制截图');
      return;
    }

    // 恢复按钮
    btn.innerHTML = '<span>⏳</span><span>识别中...</span>';
    btn.style.background = '#fff3e0';
    btn.style.borderColor = '#ff9800';
    btn.style.color = '#ff9800';

    var panel = window._activeColorPanel;
    var selfCode = btn.getAttribute('data-selfcode');
    var productCode = btn.getAttribute('data-product');
    var progressDiv = panel.querySelector('#ocrProgress');
    progressDiv.style.display = 'block';
    progressDiv.innerHTML = '⏳ 正在处理图片...';

    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        progressDiv.innerHTML = '⏳ 正在预处理图片...';
        var canvas = document.createElement('canvas');
        var scale = Math.max(2, 1500 / Math.max(img.width, img.height));
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var data = imageData.data;
        for (var j = 0; j < data.length; j += 4) {
          var gray = data[j] * 0.299 + data[j+1] * 0.587 + data[j+2] * 0.114;
          gray = gray > 128 ? Math.min(255, gray * 1.2) : gray * 0.8;
          data[j] = data[j+1] = data[j+2] = gray;
        }
        ctx.putImageData(imageData, 0, 0);
        var processedUrl = canvas.toDataURL('image/png');

        if (typeof Tesseract === 'undefined') {
          progressDiv.innerHTML = '⏳ 正在下载识别引擎(首次约10秒)...';
          var script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
          script.onload = function() { runOCR(processedUrl, progressDiv, panel, selfCode, productCode); };
          script.onerror = function() { progressDiv.innerHTML = '❌ 加载识别引擎失败，请手动输入'; };
          document.head.appendChild(script);
        } else {
          runOCR(processedUrl, progressDiv, panel, selfCode, productCode);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(imageFile);

    // 移除监听
    document.removeEventListener('paste', onPaste);
  }

  document.addEventListener('paste', onPaste);
}

      }
      ctx.putImageData(imageData, 0, 0);
      
      var processedUrl = canvas.toDataURL('image/png');
      
      // 检查 Tesseract 是否已加载
      if (typeof Tesseract === 'undefined') {

        };
        document.head.appendChild(script);
      } else {
        runOCR(processedUrl, progressDiv, panel, selfCode, productCode);
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 执行OCR识别
function runOCR(imageUrl, progressDiv, panel, selfCode, productCode) {
  progressDiv.innerHTML = '⏳ 正在识别文字...';
  
  Tesseract.recognize(imageUrl, 'chi_sim+eng', {
    logger: function(m) {
      if (m.status === 'recognizing text') {
        var pct = Math.round(m.progress * 100);
        progressDiv.innerHTML = '⏳ 识别中 ' + pct + '%...';
      }
    }
  }).then(function(result) {
    var text = result.data.text;
    progressDiv.innerHTML = '📝 识别完成，解析色号中...';
    
    // 解析识别结果
    var mappings = parseColorMappings(text, selfCode);
    
    if (mappings.length > 0) {
      var html = '<div style="margin-bottom:4px;color:#4caf50;">✅ 找到以下映射：</div>';
      mappings.forEach(function(m, idx) {
        html += '<div style="display:flex;align-items:center;gap:4px;margin:2px 0;">' +
          '<span style="min-width:50px;">' + m.self + ' → ' + m.factory + '</span>' +
          '<input type="checkbox" checked data-idx="' + idx + '" data-self="' + m.self + '" data-factory="' + m.factory + '">' +
        '</div>';
      });
      html += '<button onclick="confirmOCRSave(this)" data-product="' + productCode + '" style="margin-top:4px;padding:4px 12px;background:#4caf50;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer;">确认保存</button>';
      progressDiv.innerHTML = html;
      
      // 把mappings存到progressDiv上
      progressDiv._mappings = mappings;
    } else {
      progressDiv.innerHTML = '⚠️ 未识别到有效色号映射，请手动输入<br><span style="font-size:10px;color:#aaa;">识别文字: ' + text.substring(0, 80) + '...</span>';
    }
  }).catch(function(err) {
    progressDiv.innerHTML = '❌ 识别失败: ' + err.message + '，请手动输入';
  });
}

// 解析OCR文字提取色号映射
function parseColorMappings(text, targetSelfCode) {
  var lines = text.split(/\n/);
  var mappings = [];
  
  // 尝试匹配模式: "自编色号 工厂色号" 或 "编号 ... 颜色别名"
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    
    // 模式1: "数字#(文字) 数字/字母"
    var match = line.match(/(\d+#[^\s]*)\s+(\S+)/);
    if (match) {
      mappings.push({ self: match[1], factory: match[2] });
      continue;
    }
    
    // 模式2: 表格中的行 编号 | 颜色 | 颜色别名
    var parts = line.split(/[|\t]/);
    if (parts.length >= 2) {
      var selfPart = parts.length >= 3 ? parts[1].trim() : parts[0].trim();
      var factoryPart = parts[parts.length - 1].trim();
      if (selfPart && factoryPart && selfPart.match(/\d/)) {
        mappings.push({ self: selfPart, factory: factoryPart });
      }
    }
  }
  
  // 如果没找到通用模式，只匹配目标色号
  if (mappings.length === 0) {
    // 在文本中搜索目标色号附近的数字
    var idx = text.indexOf(targetSelfCode);
    if (idx !== -1) {
      var context = text.substring(idx, idx + 50);
      var numMatch = context.match(/\d+#[^\s]*\s+(\S+)/);
      if (numMatch) {
        mappings.push({ self: targetSelfCode, factory: numMatch[1] });
      }
    }
  }
  
  return mappings;
}

// 确认保存OCR识别的映射
function confirmOCRSave(btn) {
  var productCode = btn.getAttribute('data-product');
  var progressDiv = btn.closest('#ocrProgress');
  var panel = btn.closest('.color-helper-panel');
  var checkboxes = progressDiv.querySelectorAll('input[type="checkbox"]:checked');
  
  var saved = 0;
  checkboxes.forEach(function(cb) {
    var self = cb.getAttribute('data-self');
    var factory = cb.getAttribute('data-factory');
    addCustomColorAlias(productCode, self, factory);
    saved++;
  });
  
  // 找到目标色号的映射填入
  var rowElement = btn.closest('[id^="fRow_"]');
  var selfCodeInput = rowElement.querySelector('input[data-field="selfCode"]');
  var colorCodeInput = rowElement.querySelector('input[data-field="colorCode"]');
  var targetSelf = selfCodeInput.value.trim();
  
  for (var i = 0; i < checkboxes.length; i++) {
    if (checkboxes[i].getAttribute('data-self') === targetSelf) {
      colorCodeInput.value = checkboxes[i].getAttribute('data-factory');
      colorCodeInput.style.background = '#e8f5e9';
      setTimeout(function() { colorCodeInput.style.background = '#fff'; }, 1000);
      break;
    }
  }
  
  panel.remove();
  showToast('已保存 ' + saved + ' 条色号映射');
}

    '<button onclick="removeFactoryRow(' + rid + ')" style="width:24px;padding:4px;background:transparent;color:#ccc;border:none;font-size:16px;cursor:pointer;flex-shrink:0;border-radius:50%;transition:color .2s;">✕</button>';
  rowsDiv.appendChild(row);
  // 给自编色号输入框添加自动匹配事件
  var selfCodeInput = row.querySelector('input[data-field="selfCode"]');
  if (selfCodeInput) {
    selfCodeInput.addEventListener('blur', function() { autoFillColorAlias(row); });
    selfCodeInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { autoFillColorAlias(row); }
    });
  }
  // 去掉数字输入框的上下箭头
  var qtyInput = row.querySelector('input[data-field="quantity"]');
  qtyInput.style.cssText += '::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}';
  // 回车跳下一行同列
  var inputs = row.querySelectorAll('input');
  inputs.forEach(function(inp, idx) {
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var rowsDiv = document.getElementById('fFactoryRows');
        var allRows = rowsDiv.children;
        var myRow = inp.closest('[id^="fRow_"]');
        var rowIdx = Array.prototype.indexOf.call(allRows, myRow);
        // 如果已经是最后一行，先新增一行
        if (rowIdx >= allRows.length - 1) {
          addFactoryRow();
          allRows = rowsDiv.children;
        }
        // 跳到下一行同列
        var nextRow = allRows[rowIdx + 1];
        if (nextRow) {
          var nextInputs = nextRow.querySelectorAll('input');
          if (nextInputs[idx]) {
            nextInputs[idx].focus();
            nextInputs[idx].select();
          }
        }
      }
    });
  });
}

function removeFactoryRow(rid) {
  const row = document.getElementById('fRow_' + rid);
  if (row) row.remove();
  // 如果全部删除，自动添加一行
  if (document.getElementById('fFactoryRows').children.length === 0) {
    addFactoryRow();
  }
}

function getFactoryRows() {
  const unit = getFactoryUnit();
  const rows = [];
  document.querySelectorAll('#fFactoryRows > div').forEach(function(rowEl) {
    const inputs = rowEl.querySelectorAll('input');
    const selfCode = inputs[0].value.trim();
    const qtyNum = inputs[1].value.trim();
    const colorCode = inputs[2].value.trim();
    const note = inputs[3].value.trim();
    const quantity = qtyNum ? qtyNum + unit : '';
    if (selfCode || colorCode || qtyNum) {
      rows.push({ selfCode: selfCode, colorCode: colorCode, quantity: quantity, note: note });
    }
  });
  return rows;
}

function saveFactoryReport() {
  const factoryName = document.getElementById('fFactoryName').value.trim();
  const factoryNo = document.getElementById('fFactoryNo').value.trim();
  const rows = getFactoryRows();
  if (!factoryNo) { showToast('请填写工厂编号'); return; }
  if (rows.length === 0) { showToast('请至少填写一行色号和数量'); return; }

  const now = new Date();
  const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  const report = {
    id: Date.now(),
    date: dateStr,
    time: timeStr,
    factoryName: factoryName,
    factoryNo: factoryNo,
    productCode: localStorage.getItem('currentProductCode') || '',
    customer: (document.getElementById('fCustomerName') || {}).value || '',
    colorCard: (document.getElementById('fColorCard') || {}).value || '',
    rows: rows
  };

  // 保存工厂名称到联想库
  if (factoryName) saveFactoryName(factoryName);

  // 保存到 localStorage
  let history = getFactoryHistory();
  history.unshift(report);
  localStorage.setItem('meterConverterFactoryHistory', JSON.stringify(history));

  // 同步到 OSS
  ossSaveFactoryHistory(history);

  showToast('已保存');
  document.getElementById('fFactoryName').value = '';
  document.getElementById('fFactoryNo').value = '';
  // 清空客户名称
  var custEl = document.getElementById('fCustomerName');
  if (custEl) custEl.value = '';
  // 清空色卡编号
  var ccEl = document.getElementById('fColorCard');
  if (ccEl) ccEl.value = '';
  var ccDisp = document.getElementById('productCodeDisplay');
  if (ccDisp) ccDisp.style.display = 'none';
  localStorage.removeItem('currentProductCode');
  _factoryRowId = 0;
  document.getElementById('fFactoryRows').innerHTML = '';
  addFactoryRow();
  loadFactoryHistory();
}

function loadFactoryHistory() {
  let history = getFactoryHistory();
  const container = document.getElementById('fFactoryHistory');
  // 应用搜索和日期过滤
  const searchEl = document.getElementById('fhSearchInput');
  const fromEl = document.getElementById('fhDateFrom');
  const toEl = document.getElementById('fhDateTo');
  if (searchEl) {
    const kw = searchEl.value.trim().toLowerCase();
    const from = fromEl ? fromEl.value : '';
    const to = toEl ? toEl.value : '';
    if (kw) {
      history = history.filter(function(r) {
        return (r.customer||'').toLowerCase().indexOf(kw) !== -1 ||
               (r.colorCard||'').toLowerCase().indexOf(kw) !== -1 ||
               (r.factoryName||'').toLowerCase().indexOf(kw) !== -1 ||
               (r.factoryNo||'').toLowerCase().indexOf(kw) !== -1 ||
               (r.rows||[]).some(function(row) {
                 return (row.selfCode||'').toLowerCase().indexOf(kw) !== -1 ||
                        (row.colorCode||'').toLowerCase().indexOf(kw) !== -1 ||
                        (row.note||'').toLowerCase().indexOf(kw) !== -1;
               });
      });
    }
    if (from) {
      history = history.filter(function(r) { return r.date >= from; });
    }
    if (to) {
      history = history.filter(function(r) { return r.date <= to; });
    }
  }
  if (history.length === 0) {
    container.innerHTML = '<div style="font-size:13px;color:#999;text-align:center;padding:20px;">没有匹配的记录</div>';

      '<button onclick="deleteFactoryRecord(' + record.id + ')" style="padding:3px 10px;background:#fff;color:#ff4d4f;border:1px solid #ff4d4f;border-radius:3px;font-size:11px;cursor:pointer;">删除</button></div>';

function formatFactoryRecord(record) {
  let text = '日期：' + record.date + '\n编号：' + record.factoryNo + '\n';
  record.rows.forEach(function(r) {
    let cc = (r.colorCode||'-');
    if (cc !== '-' && cc.indexOf('#') === -1) cc = cc + '#';
    text += cc + '\t' + (r.quantity||'-') + '\t\t' + (r.note || '') + '\n';
  });
  return text;
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { var ok = document.execCommand('copy'); if(ok) showToast('已复制到剪贴板'); else throw 'fail'; } catch(e) {
    try { navigator.clipboard.writeText(text).then(function(){ showToast('已复制'); }).catch(function(){ showToast('复制失败，请长按手动复制'); }); } catch(e2) { showToast('复制失败'); }
  }
  document.body.removeChild(ta);
}

function onSmartPaste() {
  var ta = document.getElementById('fSmartPaste');
  if (!ta) return;
  var text = ta.value.trim();
  if (!text) return;
  var lines = text.split(/[\n\r]+/);
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var cn = line.match(/[\u4e00-\u9fa5]+/g);
    var code = line.match(/[A-Za-z0-9]+/g);
    if (cn && cn.length > 0) document.getElementById('fFactoryName').value = cn[0];
    if (code && code.length > 0) document.getElementById('fFactoryNo').value = code[0] + '#';
  }
  setTimeout(function() { ta.value = ''; }, 300);
  showToast('已转换 ✓');
}

// Build search index: all codes as array for fast prefix matching
var PRODUCT_DB = {};
const PRODUCT_CODES = Object.keys(PRODUCT_DB).sort();

// ===== 从OSS异步加载最新产品数据 =====
(function loadLatestProductData() {
  fetch('https://daitu001.github.io/friendship-tool/product-data.json?t=' + Date.now())

      Object.keys(PRODUCT_DB).forEach(function(k) { delete PRODUCT_DB[k]; });
      Object.assign(PRODUCT_DB, data);
      PRODUCT_CODES.length = 0;
      Object.keys(data).sort().forEach(function(k) { PRODUCT_CODES.push(k); });

function onProductSearch() {
  var input = document.getElementById('productSearchInput');
  var results = document.getElementById('productSearchResults');
  var val = input.value.trim().toLowerCase();
  
  if (!val) {
    results.style.display = 'none';
    results.innerHTML = '';
    return;
  }
  
  // Find matching codes (prefix match + exact match + contains)
  var matches = [];
  for (var i = 0; i < PRODUCT_CODES.length; i++) {
    var code = PRODUCT_CODES[i];
    var codeLower = code.toLowerCase();
    var arr = PRODUCT_DB[code];
    var colorName = (arr && arr[0] && arr[0].s) ? arr[0].s.toLowerCase() : '';
    if (codeLower === val || codeLower.indexOf(val) !== -1 || colorName.indexOf(val) !== -1) {
      matches.push(code);
      if (matches.length >= 30) break; // limit results
    }
  }
  
  // Prioritize: exact match first, then prefix, then contains
  matches.sort(function(a, b) {
    var aLower = a.toLowerCase();
    var bLower = b.toLowerCase();
    if (aLower === val) return -1;
    if (bLower === val) return 1;
    if (aLower.indexOf(val) === 0 && bLower.indexOf(val) !== 0) return -1;
    if (bLower.indexOf(val) === 0 && aLower.indexOf(val) !== 0) return 1;
    return aLower.localeCompare(bLower);
  });
  
  if (matches.length === 0) {
    results.innerHTML = '<div style="padding:10px;text-align:center;color:#999;font-size:13px;">未找到匹配产品</div>';
    results.style.display = 'block';
    return;
  }
  
  var html = '';
  for (var i = 0; i < matches.length; i++) {
    var code = matches[i];
    var entries = PRODUCT_DB[code];
    for (var j = 0; j < entries.length; j++) {
      var e = entries[j];

function selectProduct(code, factoryName, factoryCode) {
  // 保存搜索历史
  saveSearchHistory(code);
  // 保存当前产品编号（用于复制改数）
  localStorage.setItem('currentProductCode', code);
  // 显示色卡编号
  var display = document.getElementById('productCodeDisplay');
  var colorInput = document.getElementById('fColorCard');
  if (display && colorInput) {
    colorInput.value = code;
    display.style.display = 'flex';
  }
  // Fill factory name
  document.getElementById('fFactoryName').value = factoryName;
  // Fill factory code with # suffix
  var fc = factoryCode;
  if (fc && fc.indexOf('#') === -1) fc = fc + '#';
  document.getElementById('fFactoryNo').value = fc;
  // Save factory name for autocomplete
  saveFactoryName(factoryName);
  // Clear search
  document.getElementById('productSearchInput').value = '';
  document.getElementById('productSearchResults').style.display = 'none';
  showToast('已填充: ' + code + ' → ' + factoryName + ' ' + factoryCode + '#');
}

// 搜索历史功能
function saveSearchHistory(code) {
  try {
    var history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
    // 去重
    history = history.filter(function(c) { return c !== code; });
    // 加到最前面
    history.unshift(code);
    // 最多保留10条
    if (history.length > 10) history = history.slice(0, 10);
    localStorage.setItem('searchHistory', JSON.stringify(history));
  } catch(e) {}
}

function showSearchHistory() {
  var input = document.getElementById('productSearchInput');
  var results = document.getElementById('productSearchResults');
  if (input.value.trim()) return; // 有输入时不显示历史
  try {
    var history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
    if (history.length === 0) return;
    var html = '';
    for (var i = 0; i < history.length; i++) {
      html += '<div style="padding:8px 10px;border-bottom:1px solid #f5f5f5;cursor:pointer;display:flex;justify-content:space-between;align-items:center;" onclick="selectHistoryCode(\'' + history[i].replace(/'/g, "\\'") + '\')" onmouseover="this.style.background=\'#fff7e6\'" onmouseout="this.style.background=\'#fff\'">';
      html += '<span style="font-size:13px;color:#d48806;">🕐 ' + history[i] + '</span>';
      html += '<span style="font-size:11px;color:#999;">点击搜索</span>';
      html += '</div>';
    }
    results.innerHTML = html;
    results.style.display = 'block';
  } catch(e) {}
}

function convertProduct() {
  var input = document.getElementById('productSearchInput');
  var val = input.value.trim().replace('#', '');
  if (!val) { showToast('请先输入产品编号'); return; }
  var key = val.toLowerCase();
  // 精确匹配（用PRODUCT_CODES遍历，保持原始大小写）
  for (var i = 0; i < PRODUCT_CODES.length; i++) {
    if (PRODUCT_CODES[i].toLowerCase() === key) {
      var entries = PRODUCT_DB[PRODUCT_CODES[i]];
      if (entries && entries.length > 0) {
        var e = entries[0];
        input.value = PRODUCT_CODES[i];
        selectProduct(PRODUCT_CODES[i], e.f, e.fc);
        return;
      }
    }
  }
  // 前缀匹配取第一条
  for (var i = 0; i < PRODUCT_CODES.length; i++) {
    var code = PRODUCT_CODES[i];
    if (code.toLowerCase().indexOf(key) === 0) {
      var entries = PRODUCT_DB[code];
      if (entries && entries.length > 0) {
        var e = entries[0];
        input.value = code;
        selectProduct(code, e.f, e.fc);
        return;
      }
    }
  }
  showToast('未找到匹配产品: ' + val);
}

function adminUploadProductData() {
  var fileInput = document.getElementById('adminFileInput');
  var statusEl = document.getElementById('adminUploadStatus');
  var uploadBtn = document.getElementById('adminUploadBtn');

  if (!fileInput.files || fileInput.files.length === 0) {
    showAdminStatus(statusEl, '请先选择文件', 'error');
    return;
  }

  var file = fileInput.files[0];
  uploadBtn.disabled = true;
  uploadBtn.textContent = '解析中...';
  showAdminStatus(statusEl, '正在解析文件: ' + file.name, 'info');

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var workbook = XLSX.read(data, { type: 'array' });
      var result = {};
      var totalCount = 0;

      workbook.SheetNames.forEach(function(sheetName) {
        var sheet = workbook.Sheets[sheetName];
        var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        if (rows.length < 2) return;

        var headerRowIdx = -1;
        var colMap = { code: -1, factory: -1, factoryCode: -1, price: -1 };

        for (var i = 0; i < Math.min(rows.length, 10); i++) {
          var row = rows[i];
          if (!row) continue;
          for (var j = 0; j < row.length; j++) {
            var cell = String(row[j] || '').trim().toLowerCase();
            if (cell === '自编' || cell === '编号' || cell === '代码') { colMap.code = j; }
            if (cell === '工厂' || cell === '工厂名' || cell === '厂家') { colMap.factory = j; }
            if (cell === '工厂编号' || cell === '厂编' || cell === '厂编色号' || cell === '色号') { colMap.factoryCode = j; }
            if (cell === '价格' || cell === '单价' || cell === '售价') { colMap.price = j; }
          }
          if (colMap.code >= 0) { headerRowIdx = i; break; }
        }

        if (headerRowIdx < 0) {
          console.log('Sheet "' + sheetName + '" 未找到表头，跳过');
          return;
        }

        console.log('✅ Sheet "' + sheetName + '" 表头行=' + headerRowIdx + ', 列映射: 编号列=' + colMap.code + ', 工厂列=' + colMap.factory + ', 厂编列=' + colMap.factoryCode + ', 价格列=' + colMap.price);

        var seriesName = sheetName;
        for (var r = headerRowIdx + 1; r < rows.length; r++) {
          var rowData = rows[r];
          if (!rowData || rowData.length === 0) continue;
          var code = colMap.code >= 0 ? String(rowData[colMap.code] || '').trim() : '';
          var factory = colMap.factory >= 0 ? String(rowData[colMap.factory] || '').trim() : '';
          var fCode = colMap.factoryCode >= 0 ? String(rowData[colMap.factoryCode] || '').trim() : '';
          var price = colMap.price >= 0 ? String(rowData[colMap.price] || '').trim() : '';
          if (!code) continue;
          if (/^\d+\.0+$/.test(code)) { code = code.replace(/\.0+$/, ''); }
          if (!result[code]) { result[code] = []; }
          result[code].push({ s: seriesName, f: factory, fc: fCode, p: price });
          totalCount++;
        }
      });

      if (totalCount === 0) {
        showAdminStatus(statusEl, '未能从文件中解析到有效数据，请检查文件格式', 'error');
        uploadBtn.disabled = false;
        uploadBtn.textContent = '上传并更新';
        return;
      }

      // 统计价格覆盖情况
      var withPrice = 0, noPrice = 0;
      Object.keys(result).forEach(function(k) {
        result[k].forEach(function(e) {
          if ((e.p || '').trim()) withPrice++; else noPrice++;
        });
      });
      console.log('📊 解析统计: 共' + totalCount + '条, 有价格' + withPrice + '条(' + (withPrice/totalCount*100).toFixed(1) + '%), 无价格' + noPrice + '条');
      if (withPrice === 0) {
        console.warn('⚠️ 警告: 未找到任何价格数据！请检查WPS表头是否包含"价格"列');
      }

      var jsonStr = JSON.stringify(result);
      showAdminStatus(statusEl, '解析完成，共 ' + Object.keys(result).length + ' 个编号、' + totalCount + ' 条记录，正在上传到云端...', 'info');
      uploadToOSS(jsonStr, statusEl, uploadBtn, result);
    } catch (err) {
      console.error('文件解析失败:', err);
      showAdminStatus(statusEl, '文件解析失败: ' + err.message + '\n如果文件有密码保护，请先去掉密码再导出', 'error');
      uploadBtn.disabled = false;
      uploadBtn.textContent = '上传并更新';
    }
  };
  reader.onerror = function() {
    showAdminStatus(statusEl, '文件读取失败', 'error');
    uploadBtn.disabled = false;
    uploadBtn.textContent = '上传并更新';
  };
  reader.readAsArrayBuffer(file);
}

function uploadToOSS(jsonStr, statusEl, uploadBtn, parsedData) {
  if (!ossClient) {
    try { initOSS(); } catch (e) { console.error('OSS初始化失败:', e); }
  }
  if (!ossClient) {
    showAdminStatus(statusEl, 'OSS客户端初始化失败，无法上传。请检查网络连接后重试。', 'error');
    uploadBtn.disabled = false;
    uploadBtn.textContent = '上传并更新';
    return;
  }

  var blob = new Blob([jsonStr], { type: 'application/json' });
  var ossKey = 'friendship-tool/product_data.json';

  ossClient.put(ossKey, blob).then(function(res) {
    Object.keys(PRODUCT_DB).forEach(function(k) { delete PRODUCT_DB[k]; });
    Object.assign(PRODUCT_DB, parsedData);
    PRODUCT_CODES.length = 0;
    Object.keys(parsedData).sort().forEach(function(k) { PRODUCT_CODES.push(k); });

    var totalRecords = 0;
    var withPriceCount = 0;
    Object.keys(parsedData).forEach(function(k) { parsedData[k].forEach(function(e) { totalRecords++; if ((e.p||'').trim()) withPriceCount++; }); });
    var pricePct = totalRecords > 0 ? (withPriceCount/totalRecords*100).toFixed(1) : '0';
    var msg = '上传成功！\n共 ' + Object.keys(parsedData).length + ' 个编号，' + totalRecords + ' 条记录\n价格覆盖: ' + withPriceCount + '条(' + pricePct + '%)\n数据已更新到云端并同步到本地';
    showAdminStatus(statusEl, msg, 'success');
    if (typeof showToast === 'function') { showToast('产品数据已更新 ✓'); }
    uploadBtn.disabled = false;
    uploadBtn.textContent = '上传并更新';
  }).catch(function(err) {
    console.error('OSS上传失败:', err);
    showAdminStatus(statusEl, '上传失败: ' + (err.message || '未知错误') + '\n请检查网络连接后重试', 'error');
    uploadBtn.disabled = false;
    uploadBtn.textContent = '上传并更新';
  });
}

function doFactoryImportWithUnit(targetUnit) {
  try {
    var ctx = window._factoryImportCtx;
    if (!ctx) { console.error('No import context found'); return; }
    closeFactoryImportUnitDialog();
    
    // 先关闭工厂页面，回到主页面
    var fp = document.getElementById('factoryPage');
    if (fp) fp.style.display = 'none';
    var mp = document.getElementById('mainPage');
    if (mp) mp.style.display = 'block';
    
    // 切换到目标单位
    try { saveRateVal(); } catch(e) {}
    rateMode = targetUnit;
    try { syncRateUI(); } catch(e) { console.warn('syncRateUI:', e); }
    try { updateModeLabels(); } catch(e) {}
    try {
      var rateEl = document.getElementById('globalRate');
      if (targetUnit === 'meter') rateEl.value = rateEl.dataset.meterVal || '0.965';
      else if (targetUnit === 'kg') rateEl.value = rateEl.dataset.kgVal || '2';
      else if (targetUnit === 'yard') rateEl.value = rateEl.dataset.yardVal || '0';
    } catch(e) { console.warn('rateEl:', e); }
    try { saveRateVal(); } catch(e) {}
    
    // 自动填充客户名称和色卡编号
    var gcEl = document.getElementById('globalCustomer');
    if (gcEl) gcEl.value = ctx.customer || '';
    var ccEl = document.getElementById('globalColorCode');
    if (ccEl) ccEl.value = ctx.colorCard || '';
    
    // 自动保存到工厂历史
    var _afn2 = document.getElementById('fFactoryName').value.trim();
    var _ano2 = document.getElementById('fFactoryNo').value.trim();
    if (_ano2) {
      var _anow2 = new Date();
      var _ads2 = _anow2.getFullYear() + '-' + String(_anow2.getMonth()+1).padStart(2,'0') + '-' + String(_anow2.getDate()).padStart(2,'0');
      var _ats2 = String(_anow2.getHours()).padStart(2,'0') + ':' + String(_anow2.getMinutes()).padStart(2,'0');
      var _areport2 = {
        id: Date.now(), date: _ads2, time: _ats2,
        factoryName: _afn2, factoryNo: _ano2,
        customer: ctx.customer || '', colorCard: ctx.colorCard || '',
        rows: ctx.orderItems.map(function(item) {
          return { selfCode: item.selfCode, colorCode: item.colorCode, quantity: item.strips + '条', note: '' };
        })
      };
      var _ah2 = getFactoryHistory();
      _ah2.unshift(_areport2);
      localStorage.setItem('meterConverterFactoryHistory', JSON.stringify(_ah2));
      ossSaveFactoryHistory(_ah2);
    }
    
    // 强制设置全局转换率和所有已有行的转换率为模式默认值
    var defaultRate = targetUnit === 'kg' ? 2 : (targetUnit === 'yard' ? 0 : 0.965);
    var rateEl2 = document.getElementById('globalRate');
    rateEl2.value = defaultRate;
    rows.forEach(function(r) { r.rate = defaultRate; });
    
    var rate = defaultRate;
    var rowsBeforeImport = rows.length;
    
    ctx.orderItems.forEach(function(item) {
      for (var i = 0; i < item.strips; i++) {
        addRowData('', rate, ctx.customer, item.colorCode, item.selfCode);
      }
    });
    
    for (var i = rowsBeforeImport; i < rows.length; i++) {
      rows[i].index = '';
    }
    
    render();
    // 清空工厂报米数窗口所有记录
    var _ccn = document.getElementById('cmCustomerName'); if(_ccn) _ccn.value = '';
    var _ccc = document.getElementById('cmColorCardNo'); if(_ccc) _ccc.value = '';
    var _ccr = document.getElementById('cmColorRows'); if(_ccr) _ccr.innerHTML = '';
    var _fcn = document.getElementById('fCustomerName'); if(_fcn) _fcn.value = '';
    var _ffn = document.getElementById('fFactoryName'); if(_ffn) _ffn.value = '';
    var _ffno = document.getElementById('fFactoryNo'); if(_ffno) _ffno.value = '';
    var _fcl = document.getElementById('fColorCard'); if(_fcl) _fcl.value = '';
    var _pcd = document.getElementById('productCode_display'); if(_pcd) _pcd.style.display = 'none';
    showToast('已导入 ' + ctx.orderItems.reduce(function(a,b){return a+b.strips;},0) + ' 条，单位已切换');
  } catch(err) {
    console.error('doFactoryImportWithUnit error:', err);
    showToast('导入出错: ' + err.message);
  }
}
</script>

// 手动录入资料：色卡编号/工厂编号/工厂色号 inputmode=numeric；每次+添加色号加5行；修复多余</div>导致按钮嵌套进表格
(function(){
  // 1. 给三个输入框加数字键盘
  function setNumeric(){
    var ids = ['cmSelfColorCardNo','cmSelfFactoryCode'];
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if(el && !el.getAttribute('inputmode')){
        el.setAttribute('inputmode','numeric');
        el.setAttribute('pattern','[0-9]*');
      }
    });
    document.querySelectorAll('input.cm-factory-input').forEach(function(inp){
      if(!inp.getAttribute('inputmode')){
        inp.setAttribute('inputmode','numeric');
      }
    });
  }
  setNumeric();

  // 2. 重写 cmAddColorRow：每次加 5 行，新行用正确的 4 列结构（序号/→/工厂色号/✕），修复原函数少箭头+不带#号的bug
  function patchAddFive(){
    if(window.__jbAddFivePatched) return;
    window.cmAddColorRow = function(){
      var tableEl = document.getElementById('cmColorTable');
      if(!tableEl) return;
      // 移除空提示
      var tip = tableEl.querySelector('.cm-empty-tip');
      if(tip) tip.remove();
      // 计算下一个编号
      var nextNum = 1;
      tableEl.querySelectorAll('.cm-color-row').forEach(function(r){
        var cc = r.querySelector('.cm-customer-color');
        if(!cc) return;
        var raw = cc.tagName === 'INPUT' ? cc.value : cc.textContent;
        var m = (raw||'').match(/(\d+)/);
        if(m){ var n = parseInt(m[1]); if(n >= nextNum) nextNum = n + 1; }
      });
      for(var k=0;k<5;k++){
        var code = String(nextNum + k) + '#';
        var row = document.createElement('div');
        row.className = 'cm-color-row';
        row.innerHTML =
          '<input class="cm-customer-color" type="text" value="' + code + '" inputmode="text" placeholder="色号">' +
          '<div style="padding:0 6px;font-size:14px;color:#4A4238;font-weight:bold;">→</div>' +
          '<input class="cm-factory-input" type="text" value="" data-cc="' + code + '" placeholder="输入工厂色号" inputmode="numeric" onblur="if(typeof cmAutoSaveColor===\'function\')cmAutoSaveColor(this)">' +
          '<button class="cm-del-btn" onclick="if(typeof cmDelRow===\'function\')cmDelRow(this)" title="删除">✕</button>';
        // 序号input失焦时同步data-cc到factory-input（保存时用）
        (function(r){
          var ccInp = r.querySelector('input.cm-customer-color');
          var fcInp = r.querySelector('input.cm-factory-input');
          if(ccInp && fcInp){
            ccInp.addEventListener('blur', function(){
              var nv = this.value.trim();
              if(nv) fcInp.setAttribute('data-cc', nv);
            });
          }
        })(row);
        tableEl.appendChild(row);
      }
      // 补inputmode
      row.querySelectorAll('input.cm-factory-input').forEach(function(inp){
        if(!inp.getAttribute('inputmode')) inp.setAttribute('inputmode','numeric');
      });
      setTimeout(function(){
        var lastInp = tableEl.querySelector('.cm-color-row:last-child input.cm-factory-input');
        if(lastInp) lastInp.focus();
        fixLayout();
      }, 30);
    };
    window.__jbAddFivePatched = true;
  }
  patchAddFive();

  // 3. 修复 DOM 嵌套 + 把自动生成的色号序号div改成可编辑input（自编产品需要一次点击编辑）
  function fixLayout(){
    var tableEl = document.getElementById('cmColorTable');
    var addBtn = document.getElementById('cmAddBtn');
    var actionsRow = document.getElementById('cmActionsRow');
    if(!tableEl) return;
    var parent = tableEl.parentNode;
    if(!parent) return;

    // 3a. 把色号序号 div 转成可编辑 input（保证一次点击就能改）
    tableEl.querySelectorAll('.cm-color-row').forEach(function(row){
      var cc = row.querySelector('.cm-customer-color');
      if(!cc) return;
      if(cc.tagName === 'DIV' && !cc.dataset.converted){
        cc.dataset.converted = '1';
        var v = cc.textContent.trim();
        // 检查父行有没有input.cm-factory-input，取data-cc备用
        var fcInp = row.querySelector('input.cm-factory-input');
        var val = v;
        // 改为input
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'cm-customer-color';
        inp.value = val;
        inp.setAttribute('inputmode', 'text');
        inp.placeholder = '色号';
        // 点击时立即聚焦选中（解决要点两次问题）
        inp.addEventListener('click', function(){ this.focus(); this.select(); });
        // 失焦时同步更新 data-cc 到对应的 factory-input，让cmAutoSaveColor认新色号名
        inp.addEventListener('blur', function(){
          var newVal = this.value.trim();
          var fcinp = row.querySelector('input.cm-factory-input');
          if(fcinp && newVal){
            fcinp.setAttribute('data-cc', newVal);
          }
        });
        row.replaceChild(inp, cc);
      }
    });

    // 3b. 把添加按钮移到色号表之后（兄弟节点，不嵌套在行内）
    if(addBtn){
      if(addBtn.parentNode !== parent){
        parent.insertBefore(addBtn, tableEl.nextSibling);
      }
      // 确保 addBtn 在 tableEl 紧后面
      if(tableEl.nextSibling !== addBtn){
        parent.insertBefore(addBtn, tableEl.nextSibling);
      }
    }
    // 3c. 把actionsRow移到addBtn之后
    if(actionsRow){
      var ref = addBtn ? addBtn.nextSibling : tableEl.nextSibling;
      if(actionsRow.parentNode !== parent){
        parent.insertBefore(actionsRow, ref);
      } else if(actionsRow !== ref){
        parent.insertBefore(actionsRow, addBtn ? addBtn.nextSibling : tableEl.nextSibling);
      }
    }
    // 3d. 给工厂色号输入框补inputmode
    document.querySelectorAll('input.cm-factory-input').forEach(function(inp){
      if(!inp.getAttribute('inputmode')) inp.setAttribute('inputmode','numeric');
    });
  }

  // 4. 初始化+持续监听
  function boot(){
    patchAddFive();
    setNumeric();
    fixLayout();
  }
  boot();
  var mo = new MutationObserver(function(){
    setNumeric();
    // 延迟一帧再修，等原JS完成 innerHTML 写入
    setTimeout(fixLayout, 0);
    setTimeout(fixLayout, 50);
    patchAddFive();
  });
  mo.observe(document.body, {childList:true, subtree:true, characterData:true});
  // 兜底：定时检查
  setInterval(fixLayout, 800);
})();

    var v = parseFloat(inp.value);
    if(isNaN(v)){ showToast && showToast('请输入有效数字'); return; }
    var g = document.getElementById('globalRate');
    if(!g) return;
    // 先直接设置value
    var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
    nativeSetter.call(g, String(v));
    g.dispatchEvent(new Event('change',{bubbles:true}));
    // 同时更新data-*，供切换单位时保留
    var mode = getRateMode();
    if(mode==='kg') g.dataset.kgVal = String(v);
    else if(mode==='yard') g.dataset.yardVal = String(v);
    else g.dataset.meterVal = String(v);
    // 调用原系统保存和同步
    try{ if(typeof saveRateVal==='function') saveRateVal(); }catch(e){}
    try{ if(typeof syncAllRowRates==='function') syncAllRowRates(String(v)); }catch(e){}
    showToast && showToast('默认转换率已更新：' + v);
    closeModal();
  }

  overlay.addEventListener('click', closeModal); // 点遮罩关闭
  overlay.querySelector('#jbRateCancel').addEventListener('click', closeModal);
  overlay.querySelector('#jbRateOk').addEventListener('click', confirmModal);
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); confirmModal(); }
    if(e.key==='Escape'){ e.preventDefault(); closeModal(); }
  });

  // 绑定到转换率输入框+标签
  function bind(){
    var g = document.getElementById('globalRate');
    var lbl = document.getElementById('rateLabel');
    if(g && !g.dataset.jbBound){
      g.dataset.jbBound = '1';
      g.setAttribute('readonly','readonly'); // 禁止直接编辑，只能通过弹窗
      g.addEventListener('click', function(e){ e.preventDefault(); openModal(); });
      g.addEventListener('focus', function(e){ e.preventDefault(); g.blur(); openModal(); });
    }
    if(lbl && !lbl.dataset.jbBound){
      lbl.dataset.jbBound = '1';
      lbl.addEventListener('click', openModal);
    }
  }
  bind();
  var mo = new MutationObserver(bind);
  mo.observe(document.body, {childList:true, subtree:true});
})();

// v50：优化云端状态胶囊样式 + 点击手动同步
(function(){
  function polish(){
    var el = document.getElementById('cloudStatus');
    if(!el) return;
    // 去掉emoji云（用CSS伪元素小圆点代替）
    if(el.dataset.polished !== '1'){
      el.dataset.polished = '1';
      el.addEventListener('click', function(){
        // 点一下触发手动保存
        try{
          if(typeof saveWorkData==='function'){ saveWorkData(); showToast && showToast('正在同步...'); }
          else if(typeof collectWorkData==='function' && typeof ossSaveWorkData==='function'){
            var d = collectWorkData();
            ossSaveWorkData(d);
            showToast && showToast('正在同步...');
          }
        }catch(e){ console.warn(e); }
      });
    }
    // 每次setTextContent后去掉☁
    var t = el.textContent || '';
    t = t.replace(/[☁️⛅]/g,'').replace(/^\s+|\s+$/g,'');
    if(t.indexOf('已同步')>=0) t = '已同步';
    else if(t.indexOf('同步中')>=0) t = '同步中';
    else if(t.indexOf('失败')>=0) t = '失败 点重试';
    else if(t.indexOf('未同步')>=0 || t.indexOf('连接')>=0) t = '未同步 点同步';
    if(el.textContent !== t){
      el.textContent = t;
    }
  }
  polish();
  var mo = new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      if(muts[i].type==='characterData' || (muts[i].target && muts[i].target.id==='cloudStatus')){ polish(); break; }
    }
    polish();
  });
  mo.observe(document.body, {childList:true, subtree:true, characterData:true});
})();

</script>
