<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>友谊纺 · 大货报单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #pwOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; z-index: 99999; }
  #pwOverlay.hidden { display: none; }
  .pw-box { text-align: center; width: 280px; }
  .pw-box h2 { color: #fff; font-size: 20px; margin-bottom: 24px; font-weight: 600; letter-spacing: 1px; }
  .pw-box input { width: 100%; padding: 12px 16px; font-size: 16px; text-align: center; border: none; border-bottom: 2px solid #444; background: transparent; color: #fff; outline: none; letter-spacing: 4px; transition: border-color 0.2s; }
  .pw-box input:focus { border-color: #fff; }
  .pw-box input::placeholder { color: #666; letter-spacing: 1px; }
  .pw-box button { margin-top: 24px; width: 100%; padding: 12px; background: #fff; color: #111; border: none; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 3px; transition: opacity 0.2s; }
  .pw-box button:hover { opacity: 0.9; }
  .pw-box .pw-err { color: #ff4d4f; font-size: 12px; margin-top: 10px; min-height: 18px; }
  html, body { height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #fafafa; color: #222; padding: 12px; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .container { max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; flex: 1; overflow: visible; background: #fff; border-radius: 4px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); border: 1px solid #eaeaea; padding: 16px; position: relative; min-height: 0; }
  h1 { text-align: center; font-size: 18px; color: #111; margin-bottom: 14px; font-weight: 700; flex-shrink: 0; letter-spacing: 0.5px; }
  .top-section { flex-shrink: 0; }
  .global-rate { background: #fafafa; border-radius: 4px; padding: 12px 14px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #eee; }
  .global-rate label { font-size: 13px; font-weight: 600; color: #555; }
  .global-rate input { width: 95px; padding: 4px 6px; border: none; border-bottom: 1.5px solid #ccc; border-radius: 0; font-size: 18px; text-align: right; outline: none; transition: border-color 0.2s; background: transparent; }
  .global-rate input:focus { border-color: #222; }
  .global-rate .unit { font-size: 12px; color: #999; margin-left: 4px; }
  .history-btn { background: transparent; border: 1px solid #ddd; border-radius: 3px; padding: 5px 12px; font-size: 12px; font-weight: 500; color: #444; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .history-btn:hover { border-color: #999; background: #f5f5f5; }
  .cloud-status { font-size: 11px; color: #52c41a; margin-left: 8px; white-space: nowrap; }
  .cloud-status.syncing { color: #faad14; }
  .cloud-status.error { color: #ff4d4f; }
  .summary { background: #111; border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; color: #fff; flex-shrink: 0; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .summary-item { border-radius: 0; padding: 8px 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .summary-item .label { font-size: 11px; opacity: 0.6; margin-bottom: 3px; letter-spacing: 0.5px; }
  .summary-item .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; flex-shrink: 0; }
  .btn { flex: 1; min-width: 0; padding: 10px 6px; border: none; border-radius: 3px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 4px; letter-spacing: 0.3px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #111; color: #fff; }
  .btn-primary:hover { background: #333; }
  .btn-outline { background: #fff; color: #444; border: 1px solid #ddd; }
  .btn-outline:hover { background: #f5f5f5; border-color: #bbb; }
  .btn-success { background: #fff; color: #222; border: 1px solid #222; }
  .btn-success:hover { background: #f5f5f5; }
  .btn-warn { background: #fff; color: #444; border: 1px solid #ddd; }
  .btn-warn:hover { background: #f5f5f5; border-color: #bbb; }
  .table-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 90px; position: relative; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
  .table-wrap { background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eee; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #f5f5f5; padding: 8px 6px; font-size: 11px; font-weight: 700; color: #666; border-bottom: 2px solid #e0e0e0; text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 10; scroll-snap-align: start; letter-spacing: 0.5px; text-transform: uppercase; }
  tbody td { padding: 10px 6px; text-align: center; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  tbody tr { transition: background 0.1s; scroll-snap-align: start; }
  tbody tr.group-separator td { border-top: 2px solid #ddd; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }
  .td-index { color: #999; font-size: 13px; width: 40px; }
  .td-color { width: 100px; }
  .td-color input { width: 100%; padding: 6px 8px; border: 1px solid #e0e0e0; border-radius: 3px; font-size: 14px; text-align: center; outline: none; transition: border-color 0.15s; }
  .td-color input:focus { border-color: #222; }
  .td-meters { width: 85px; }
  .td-meters input[type=number] { -moz-appearance: textfield; -webkit-appearance: none; appearance: none; }
  .td-meters input[type=number]::-webkit-outer-spin-button, .td-meters input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .td-meters input { width: 100%; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 3px; font-size: 16px; font-weight: 700; color: #111; text-align: center; outline: none; transition: border-color 0.15s; }
  .td-meters input:focus { border-color: #222; }
  .td-rate { width: 110px; padding-left: 16px; }
  .td-rate input { width: 100%; padding: 6px 12px 6px 8px; border: 1px solid #e0e0e0; border-radius: 3px; font-size: 14px; text-align: center; outline: none; transition: border-color 0.15s; }
  .td-rate input:focus { border-color: #222; }
  .td-kgrate { width: 80px; }
  .td-kgrate input { width: 100%; padding: 6px 8px; border: 1px solid #e0e0e0; border-radius: 3px; font-size: 14px; text-align: center; outline: none; transition: border-color 0.15s; }
  .td-kgrate input:focus { border-color: #222; }
  .td-kgresult { font-weight: 700; color: #111; font-size: 15px; }
  .td-result { font-weight: 700; color: #111; font-size: 15px; }
  .td-delete { width: 40px; }
  .btn-del { background: none; border: none; color: #ff4d4f; font-size: 18px; cursor: pointer; padding: 4px; border-radius: 50%; line-height: 1; transition: background 0.15s; }
  .btn-del:hover { background: #fff5f5; }
  .calc-process { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; padding: 12px 16px; z-index: 100; max-width: 600px; margin: 0 auto; max-height: 120px; overflow-y: auto; }
  .calc-process .title { font-size: 12px; color: #999; margin-bottom: 6px; }
  .calc-process .formula { font-size: 14px; color: #222; word-break: break-all; line-height: 1.5; }
  .calc-process .formula .num { color: #111; font-weight: 700; }
  .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 0; font-size: 14px; z-index: 999; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  .toast.show { opacity: 1; }
  #csvInput { display: none; }

  

  /* ===== 历史记录页 ===== */
  .history-page { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fafafa; z-index: 500; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }
  .history-page.show { display: block; }
  .history-inner { max-width: 600px; margin: 0 auto; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .history-header h2 { font-size: 18px; font-weight: 700; color: #111; }
  .history-close-btn { background: #fff; border: 1px solid #ddd; border-radius: 3px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: #666; transition: all 0.15s; }
  .history-close-btn:hover { border-color: #ff4d4f; color: #ff4d4f; background: #fff5f5; }
  .h-sync-btn { background: #222; color: #fff; border: none; border-radius: 3px; padding: 5px 12px; font-size: 12px; cursor: pointer; margin-right: 8px; font-weight: 600; }
  .h-sync-btn:hover { background: #333; }
  .h-search-box { position: sticky; top: 0; z-index: 100; background: #fff; padding: 4px 0 8px 0; margin-bottom: 4px; }
  .h-search-input { width: 100%; height: 36px; border: 1px solid #ddd; border-radius: 3px; padding: 0 36px 0 12px; font-size: 14px; color: #222; outline: none; background: #fff; }
  .h-search-input:focus { border-color: #222; }
  .h-search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #999; pointer-events: none; }
  .h-filter { position: sticky; top: 48px; z-index: 99; background: #f5f5f5; border-radius: 3px; padding: 10px 14px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .h-filter label { font-size: 12px; color: #666; }
  .h-filter input[type="date"] { flex: 1; height: 32px; border: 1px solid #ddd; border-radius: 3px; padding: 0 8px; font-size: 13px; outline: none; min-width: 0; }
  .h-filter input[type="date"]:focus { border-color: #222; }
  .h-filter-btn { height: 32px; padding: 0 12px; border: none; border-radius: 3px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .h-filter-primary { background: #222; color: #fff; }
  .h-filter-reset { background: #eee; color: #666; }
  .h-date-card { background: #fff; border-radius: 3px; padding: 12px 14px; margin-bottom: 6px; box-shadow: none; border: 1px solid #eee; cursor: pointer; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; }
  .h-date-card:hover { border-color: #ccc; }
  .h-date-text { font-size: 15px; font-weight: 600; color: #111; }
  .h-count-text { font-size: 13px; color: #999; }
  .h-arrow { font-size: 16px; color: #ccc; }
  .h-back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #111; cursor: pointer; margin-bottom: 12px; border: none; background: none; font-weight: 600; }
  .h-back-btn:hover { text-decoration: underline; }
  .h-page-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 12px; }
  .h-cust-card { background: #fff; border-radius: 3px; margin-bottom: 6px; border: 1px solid #eee; overflow: hidden; }
  .h-cust-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; cursor: pointer; transition: background 0.15s; }
  .h-cust-header:hover { background: #fafafa; }
  .h-cust-name { font-size: 14px; font-weight: 700; color: #111; }
  .h-cust-info { font-size: 12px; color: #999; }
  .h-cust-header .h-arrow { transition: transform 0.2s; }
  .h-cust-header.expanded .h-arrow { transform: rotate(90deg); }
  .h-cust-detail { display: none; padding: 0 14px 12px; border-top: 1px solid #f0f0f0; }
  .h-cust-detail.show { display: block; }
  .h-record { background: #fafafa; border-radius: 3px; padding: 10px 12px; margin-top: 8px; }
  .h-record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .h-record-title { font-size: 12px; font-weight: 600; color: #666; }
  .h-record-del { font-size: 12px; color: #ff4d4f; cursor: pointer; border: none; background: none; font-weight: 500; margin-left: 14px; }
  .h-record-del:hover { text-decoration: underline; }
  .h-record-edit { font-size: 12px; color: #1677ff; cursor: pointer; border: none; background: none; font-weight: 500; margin-right: 8px; }
  .h-record-edit:hover { text-decoration: underline; }
  .h-record-btns { display: flex; align-items: center; }
  .h-data-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; color: #555; }
  .h-data-row .h-label { color: #888; }
  .h-data-row .h-value { font-weight: 600; color: #111; }
  .h-no-result { text-align: center; color: #999; font-size: 14px; padding: 40px 0; }
  .highlight { background: #fff3cd; padding: 0 2px; border-radius: 2px; }


  /* ===== 移动端响应式适配 ===== */
  /* 平板及以下屏幕 */
  @media screen and (max-width: 768px) {
    body { padding: 8px; }
    .container { padding: 10px; border-width: 2px; }
    h1 { font-size: 18px; margin-bottom: 10px; }

    .global-rate { padding: 10px 12px; flex-wrap: wrap; gap: 8px; }
    .global-rate label { font-size: 14px; }
    .global-rate input { width: 80px; font-size: 14px; padding: 8px 8px; }

    .summary { padding: 12px; }
    .summary-grid { gap: 8px; }
    .summary-item { padding: 8px 10px; }
    .summary-item .value { font-size: 18px; }
    .summary-item .label { font-size: 11px; }

    .actions { gap: 6px; }
    .btn { padding: 12px 6px; font-size: 12px; min-width: 0; flex: 1 1 calc(33% - 6px); }

    thead th { padding: 8px 4px; font-size: 12px; }
    tbody td { padding: 8px 4px; font-size: 13px; }
    .td-index { width: 30px; font-size: 12px; }
    .td-color { width: 80px; }
    .td-color input { font-size: 13px; padding: 8px 6px; }
    .td-meters { width: 70px; }
    .td-meters input { font-size: 14px; padding: 8px 6px; }
    .td-rate { width: 85px; padding-left: 8px; }
    .td-rate input { font-size: 13px; padding: 8px 6px 8px 6px; }
    .td-kgrate { width: 65px; }
    .td-kgrate input { font-size: 13px; padding: 8px 6px; }
    .td-kgresult { font-size: 14px; }
    .td-result { font-size: 14px; }
    .td-delete { width: 36px; }
    .btn-del { font-size: 20px; padding: 6px; }

    .calc-process { padding: 10px 12px; max-height: 100px; }
    .calc-process .title { font-size: 12px; }
    .calc-process .formula { font-size: 13px; }
    .table-scroll { padding-bottom: 80px; }
  }

  /* 小屏手机 */
  @media screen and (max-width: 420px) {
    body { padding: 4px; font-size: 14px; }
    .container { padding: 8px; border-width: 2px; }
    h1 { font-size: 16px; margin-bottom: 8px; }

    .global-rate { padding: 8px 10px; margin-bottom: 8px !important; }
    .global-rate input { width: 70px; font-size: 13px; padding: 7px 6px; }
    .global-rate .unit { font-size: 12px; }
    .history-btn { font-size: 11px !important; padding: 6px 8px !important; }

    .summary { padding: 10px; margin-bottom: 8px; }
    .summary-grid { gap: 6px; grid-template-columns: 1fr 1fr; }
    .summary-item { padding: 6px 8px; }
    .summary-item .value { font-size: 16px; }
    .summary-item .label { font-size: 10px; }

    .actions { gap: 5px; margin-bottom: 8px; }
    .btn { padding: 11px 4px; font-size: 11px; flex: 1 1 calc(50% - 5px); border-width: 1px; }

    thead th { padding: 6px 3px; font-size: 11px; white-space: nowrap; }
    tbody td { padding: 6px 3px; font-size: 12px; }
    .td-index { width: 24px; font-size: 11px; }
    .td-color { width: 65px; }
    .td-color input { font-size: 12px; padding: 7px 4px; }
    .td-meters { width: 60px; }
    .td-meters input { font-size: 13px; padding: 7px 4px; }
    .td-rate { width: 70px; padding-left: 4px; }
    .td-rate input { font-size: 12px; padding: 7px 4px; }
    .td-kgrate { width: 55px; }
    .td-kgrate input { font-size: 12px; padding: 7px 4px; }
    .td-kgresult { font-size: 13px; }
    .td-result { font-size: 13px; }
    .td-delete { width: 30px; }
    .btn-del { font-size: 18px; padding: 4px; }

    .calc-process { padding: 8px 10px; max-height: 80px; }
    .calc-process .title { font-size: 11px; margin-bottom: 4px; }
    .calc-process .formula { font-size: 12px; line-height: 1.4; }
    .table-scroll { padding-bottom: 70px; }

    /* 历史记录页适配 */
    .history-page { padding: 10px; }
    .history-header h2 { font-size: 16px; }
    .history-close-btn { padding: 6px 10px; font-size: 12px; }
    .h-sync-btn { padding: 6px 10px; font-size: 12px; }
    .h-search-input { height: 36px; font-size: 13px; }
    .h-filter { padding: 8px 10px; gap: 6px; }
    .h-filter label { font-size: 12px; }
    .h-filter input[type="date"] { height: 30px; font-size: 12px; }
    .h-filter-btn { height: 30px; padding: 0 10px; font-size: 12px; }
    .h-date-card { padding: 10px 12px; }
    .h-date-text { font-size: 14px; }
    .h-count-text { font-size: 12px; }
    .h-cust-header { padding: 10px 12px; }
    .h-cust-name { font-size: 14px; }
    .h-record { padding: 8px 10px; }
    .h-data-row { font-size: 12px; }
  }

  /* 超小屏手机 (iPhone SE 等) */
  @media screen and (max-width: 360px) {
    .container { padding: 6px; }
    h1 { font-size: 15px; }
    .global-rate input { width: 60px; font-size: 12px; }
    .btn { font-size: 10px; padding: 10px 3px; }
    thead th { font-size: 10px; padding: 5px 2px; }
    tbody td { font-size: 11px; padding: 5px 2px; }
    .td-color { width: 58px; }
    .td-meters { width: 55px; }
    .td-rate { width: 62px; }
    .td-kgrate { width: 50px; }
  }

  /* 横屏适配 */
  @media screen and (max-height: 500px) and (orientation: landscape) {
    .container { padding: 8px; }
    h1 { font-size: 16px; margin-bottom: 6px; }
    .summary { padding: 8px; margin-bottom: 6px; }
    .summary-item .value { font-size: 16px; }
    .calc-process { max-height: 60px; padding: 6px 10px; }
    .table-scroll { padding-bottom: 50px; }
  }

  /* 触屏设备优化 */
  @media (hover: none) and (pointer: coarse) {
    .btn { min-height: 44px; }
    .history-btn { min-height: 40px; }
    .btn-del { min-width: 44px; min-height: 44px; }
    input, button, select { font-size: 16px !important; }
    .btn { font-size: 12px !important; }
    .history-btn { font-size: 12px !important; }
    thead th { font-size: 12px !important; }
    tbody td { font-size: 13px !important; }
    .td-color input, .td-meters input, .td-rate input, .td-kgrate input { font-size: 15px !important; }
  }


/* ===== 管理员面板样式 ===== */
.admin-entry-btn { position: absolute; top: 50%; right: -4px; transform: translateY(-50%); background: transparent; border: 1px solid #ddd; border-radius: 3px; padding: 2px 8px; font-size: 10px; color: #aaa; cursor: pointer; transition: all 0.15s; }
.admin-entry-btn:hover { border-color: #999; color: #555; background: #f5f5f5; }
.admin-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 1000; justify-content: center; align-items: center; }
.admin-overlay.active { display: flex; }
.admin-panel { background: #fff; border-radius: 4px; width: 90%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; }
.admin-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #eee; }
.admin-panel-header h3 { font-size: 15px; font-weight: 700; color: #222; margin: 0; }
.admin-panel-close { background: transparent; border: none; font-size: 20px; color: #999; cursor: pointer; padding: 0 4px; line-height: 1; }
.admin-panel-close:hover { color: #333; }
.admin-panel-body { padding: 16px; }
.admin-pwd-group { margin-bottom: 14px; }
.admin-pwd-group label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; }
.admin-pwd-group input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; outline: none; transition: border-color 0.15s; }
.admin-pwd-group input:focus { border-color: #222; }
.admin-login-btn { width: 100%; padding: 9px; background: #111; color: #fff; border: none; border-radius: 3px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.admin-login-btn:hover { background: #333; }
.admin-login-btn:active { transform: scale(0.98); }
.admin-update-section { display: none; }
.admin-update-section.active { display: block; }
.admin-file-group { margin-bottom: 12px; }

<script>
// 友谊工具数据同步模块
// 用于样布工具和大货工具之间的数据共享

const FriendshipSync = {
  STORAGE_KEY: 'friendshipTool_sharedData',
  
  // 获取共享数据
  getSharedData: function() {
    try {
      const raw = localStorage.getItem(this.STORAGE_KEY);
      return raw ? JSON.parse(raw) : {
        products: {},      // 产品编号 -> 产品信息
        colors: {},        // 色号 -> 色号信息
        factories: {},     // 工厂编号 -> 工厂信息
        lastUpdated: null
      };
    } catch(e) {
      console.error('读取共享数据失败:', e);
      return { products: {}, colors: {}, factories: {}, customers: {}, factoryNameMap: {}, factoryColorMap: {}, lastUpdated: null };
    }
  },
  
  // 保存共享数据
  saveSharedData: function(data) {
    try {
      data.lastUpdated = new Date().toISOString();
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
      // 触发自定义事件通知其他标签页
      window.dispatchEvent(new CustomEvent('friendshipDataChanged', { detail: data }));
      return true;
    } catch(e) {
      console.error('保存共享数据失败:', e);
      return false;
    }
  },
  
  // 同步产品数据
  syncProduct: function(productCode, productInfo) {
    const data = this.getSharedData();
    data.products[productCode] = productInfo;
    return this.saveSharedData(data);
  },
  
  // 同步色号数据
  syncColor: function(colorCode, colorInfo) {
    const data = this.getSharedData();
    data.colors[colorCode] = colorInfo;
    return this.saveSharedData(data);
  },
  
  // 同步工厂数据
  syncFactory: function(factoryCode, factoryInfo) {
    const data = this.getSharedData();
    data.factories[factoryCode] = factoryInfo;
    return this.saveSharedData(data);
  },
  
  // 同步客户数据
  syncCustomer: function(customerName, customerInfo) {
    const data = this.getSharedData();
    if (!data.customers) data.customers = {};
    data.customers[customerName] = Object.assign({
      name: customerName,
      updatedBy: 'sampleTool',
      updatedAt: new Date().toISOString()
    }, customerInfo || {});
    return this.saveSharedData(data);
  },

  // 同步工厂名称->编号映射（土土协作内部使用）
  syncFactoryNameMap: function(factoryName, factoryCode) {
    if (!factoryName || !factoryCode) return false;
    const data = this.getSharedData();
    if (!data.factoryNameMap) data.factoryNameMap = {};
    data.factoryNameMap[factoryName] = {
      code: factoryCode,
      updatedBy: 'tutuCollab',
      updatedAt: new Date().toISOString()
    };
    return this.saveSharedData(data);
  },

  // 同步工厂编号+色号->色卡编号映射（土土协作内部使用）
  syncFactoryColorMap: function(factoryCode, factoryColor, colorCardNo, colorCardColor) {
    if (!factoryCode || !factoryColor) return false;
    const data = this.getSharedData();
    if (!data.factoryColorMap) data.factoryColorMap = {};
    const key = factoryCode + '_' + factoryColor;
    data.factoryColorMap[key] = {
      factoryCode: factoryCode,
      factoryColor: factoryColor,
      colorCardNo: colorCardNo || '',
      colorCardColor: colorCardColor || '',
      updatedBy: 'tutuCollab',
      updatedAt: new Date().toISOString()
    };
    return this.saveSharedData(data);
  },

  // 批量同步工厂名称映射
  syncFactoryNameMapBatch: function(mappings) {
    if (!mappings || Object.keys(mappings).length === 0) return false;
    const data = this.getSharedData();
    if (!data.factoryNameMap) data.factoryNameMap = {};
    Object.assign(data.factoryNameMap, mappings);
    return this.saveSharedData(data);
  },

  // 批量同步工厂色号映射
  syncFactoryColorMapBatch: function(mappings) {
    if (!mappings || Object.keys(mappings).length === 0) return false;
    const data = this.getSharedData();
    if (!data.factoryColorMap) data.factoryColorMap = {};
    Object.assign(data.factoryColorMap, mappings);
    return this.saveSharedData(data);
  },
  
  // 批量同步
  syncBatch: function(products, colors, factories) {
    const data = this.getSharedData();
    if (products) Object.assign(data.products, products);
    if (colors) Object.assign(data.colors, colors);
    if (factories) Object.assign(data.factories, factories);
    return this.saveSharedData(data);
  },
  
  // 监听数据变化
  onDataChange: function(callback) {
    // 监听storage事件（跨标签页）
    window.addEventListener('storage', (e) => {
      if (e.key === this.STORAGE_KEY) {
        try {
          const newData = JSON.parse(e.newValue);
          callback(newData);
        } catch(err) {
          console.error('解析变化数据失败:', err);
        }
      }
    });
    
    // 监听自定义事件（同标签页）
    window.addEventListener('friendshipDataChanged', (e) => {
      callback(e.detail);
    });
  }
};

// 导出到全局
if (typeof window !== 'undefined') {
  window.FriendshipSync = FriendshipSync;
}


// === 大货工具同步逻辑 ===
(function() {
  // 页面加载后，从共享数据获取产品/色号/工厂信息
  function loadSharedDataIntoV50() {
    var shared = FriendshipSync.getSharedData();
    if (!shared || !shared.lastUpdated) return;
    
    // 从共享数据中获取工厂色号映射，自动填充
    // 此处主要记录共享数据，供后续使用
    window._friendshipSharedData = shared;
    console.log('[FriendshipSync] 大货工具已加载共享数据:', 
      Object.keys(shared.products || {}).length, '个产品,',
      Object.keys(shared.colors || {}).length, '个色号,',
      Object.keys(shared.factories || {}).length, '个工厂');
  }
  
  // 注册跨标签页监听
  FriendshipSync.onDataChange(function(newData) {
    console.log('[FriendshipSync] 检测到共享数据变化，更新大货工具...');
    window._friendshipSharedData = newData;
  });
  
  // 页面加载时执行：先从OSS下载最新数据，再合并
  async function initWithCloudData() {
    try {
      await downloadSharedDataFromOSS();
    } catch(e) {
      console.warn('[SharedSync] 初始云端下载失败:', e);
    }
    loadSharedDataIntoV50();
    initCustomerAutocompleteV50();
    
    // 启动定时同步（每30秒）
    setInterval(async function() {
      try {
        var data = await downloadSharedDataFromOSS();
        if (data) {
          console.log('[SharedSync] 定时同步成功');
          if (typeof refreshAfterSync === 'function') refreshAfterSync();
        }
      } catch(e) {
        console.warn('[SharedSync] 定时同步失败:', e);
      }
    }, 30000);
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initWithCloudData);
  } else {
    initWithCloudData();
  }
})();

// 同步后刷新页面数据
function refreshAfterSync() {
  // 重新加载共享数据
  if (typeof FriendshipSync !== 'undefined') {
    var shared = FriendshipSync.getSharedData();
    if (shared) {
      window._friendshipSharedData = shared;
      console.log('[SharedSync] 大货工具刷新数据:', 
        Object.keys(shared.products || {}).length, '个产品,',
        Object.keys(shared.colors || {}).length, '个色号,',
        Object.keys(shared.factories || {}).length, '个工厂');
    }
  }
  // 刷新客户名称联想
  if (typeof initCustomerAutocompleteV50 === 'function') initCustomerAutocompleteV50();
}

<script>
// ===== 云端共享数据同步模块 =====
const SHARED_DATA_OSS_KEY = 'friendship-tool/shared-data.json';
const OSS_CONFIG_SHARED = {
  region: 'oss-cn-guangzhou',
  bucket: 'youyi-01mishu',
  accessKeyId: 'LTAI5tAc2z' + 'n5iTjMK2Kbpi8m',
  accessKeySecret: 'uSZ8Lyt5tCC' + 'UqgZTdv3BS8sjRcUXLy',
  endpoint: 'oss-cn-guangzhou.aliyuncs.com'
};
let sharedOssClient = null;

function initSharedOSS() {
  if (typeof OSS === 'undefined') {
    console.log('[SharedSync] OSS SDK 未加载');
    return;
  }
  try {
    sharedOssClient = new OSS({
      region: OSS_CONFIG_SHARED.region,
      accessKeyId: OSS_CONFIG_SHARED.accessKeyId,
      accessKeySecret: OSS_CONFIG_SHARED.accessKeySecret,
      bucket: OSS_CONFIG_SHARED.bucket,
      endpoint: OSS_CONFIG_SHARED.endpoint,
      secure: true
    });
    console.log('[SharedSync] OSS客户端初始化成功');
  } catch(e) {
    console.error('[SharedSync] OSS初始化失败:', e);
  }
}

// 设置同步状态UI
function setSyncStatus(status, msg) {
  var el = document.getElementById('sharedSyncStatus');
  if (!el) return;
  if (status === 'syncing') {
    el.innerHTML = '<span style="color:#faad14">⏳ 同步中...</span>';
  } else if (status === 'success') {
    var now = new Date();
    var ts = (now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
    el.innerHTML = '<span style="color:#52c41a">✓ 已同步 ' + ts + '</span>';
  } else if (status === 'error') {
    el.innerHTML = '<span style="color:#ff4d4f">✗ 同步失败</span>';
  } else {
    el.innerHTML = '<span style="color:#999">' + (msg || '☁ 未同步') + '</span>';
  }
}

// 上传共享数据到OSS
async function uploadSharedDataToOSS() {
  if (!sharedOssClient) initSharedOSS();
  if (!sharedOssClient) {
    console.warn('[SharedSync] OSS不可用，跳过上传');
    setSyncStatus('error');
    return false;
  }
  try {
    setSyncStatus('syncing');
    var data;
    if (typeof FriendshipSync !== 'undefined') {
      data = FriendshipSync.getSharedData();
    } else {
      var raw = localStorage.getItem('friendshipTool_sharedData');
      data = raw ? JSON.parse(raw) : { products: {}, colors: {}, factories: {}, lastUpdated: null };
    }
    data.lastSyncTime = new Date().toISOString();
    var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    await sharedOssClient.put(SHARED_DATA_OSS_KEY, blob);
    console.log('[SharedSync] 上传成功');
    setSyncStatus('success');
    return true;
  } catch(e) {
    console.error('[SharedSync] 上传失败:', e);
    setSyncStatus('error');
    return false;
  }
}

// 从OSS下载共享数据
async function downloadSharedDataFromOSS() {
  if (!sharedOssClient) initSharedOSS();
  if (!sharedOssClient) {
    console.warn('[SharedSync] OSS不可用，跳过下载');
    setSyncStatus('error');
    return null;
  }
  try {
    setSyncStatus('syncing');
    var result = await sharedOssClient.get(SHARED_DATA_OSS_KEY);
    var cloudData = JSON.parse(result.content.toString());
    console.log('[SharedSync] 下载成功:', cloudData);
    
    // 合并到本地localStorage
    mergeSharedDataFromCloud(cloudData);
    
    setSyncStatus('success');
    return cloudData;
  } catch(e) {
    if (e.status === 404 || e.code === 'NoSuchKey') {
      console.log('[SharedSync] 云端暂无共享数据文件');
      setSyncStatus('success');
    } else {
      console.error('[SharedSync] 下载失败:', e);
      setSyncStatus('error');
    }
    return null;
  }
}

// 合并云端数据到本地（以lastUpdated时间戳为准）
function mergeSharedDataFromCloud(cloudData) {
  if (!cloudData) return;
  var localData;
  if (typeof FriendshipSync !== 'undefined') {
    localData = FriendshipSync.getSharedData();
  } else {
    var raw = localStorage.getItem('friendshipTool_sharedData');
    localData = raw ? JSON.parse(raw) : { products: {}, colors: {}, factories: {}, lastUpdated: null };
  }
  
  // 合并产品：以updatedAt时间戳为准
  if (cloudData.products) {
    Object.keys(cloudData.products).forEach(function(code) {
      var cloudItem = cloudData.products[code];
      var localItem = localData.products ? localData.products[code] : null;
      if (!localItem || (cloudItem.updatedAt && localItem.updatedAt && cloudItem.updatedAt >= localItem.updatedAt) || !localItem.updatedAt) {
        if (!localData.products) localData.products = {};
        localData.products[code] = cloudItem;
      }
    });
  }
  
  // 合并色号
  if (cloudData.colors) {
    Object.keys(cloudData.colors).forEach(function(code) {
      var cloudItem = cloudData.colors[code];
      var localItem = localData.colors ? localData.colors[code] : null;
      if (!localItem || (cloudItem.updatedAt && localItem.updatedAt && cloudItem.updatedAt >= localItem.updatedAt) || !localItem.updatedAt) {
        if (!localData.colors) localData.colors = {};
        localData.colors[code] = cloudItem;
      }
    });
  }
  
  // 合并工厂
  if (cloudData.factories) {
    Object.keys(cloudData.factories).forEach(function(code) {
      var cloudItem = cloudData.factories[code];
      var localItem = localData.factories ? localData.factories[code] : null;
      if (!localItem || (cloudItem.updatedAt && localItem.updatedAt && cloudItem.updatedAt >= localItem.updatedAt) || !localItem.updatedAt) {
        if (!localData.factories) localData.factories = {};
        localData.factories[code] = cloudItem;
      }
    });
  }
  
  localData.lastUpdated = new Date().toISOString();
  localStorage.setItem('friendshipTool_sharedData', JSON.stringify(localData));
  
  if (typeof FriendshipSync !== 'undefined') {
    window.dispatchEvent(new CustomEvent('friendshipDataChanged', { detail: localData }));
  }
  
  console.log('[SharedSync] 数据合并完成');
}

// 手动同步按钮
async function manualSyncSharedData() {
  var result = await downloadSharedDataFromOSS();
  if (result) {
    showToast('✓ 已同步最新数据');
    // 刷新页面数据
    if (typeof refreshAfterSync === 'function') {
      refreshAfterSync();
    }
  } else {
    showToast('⚠ 同步失败，请检查网络');
  }
}

  font-size: 14px !important; color: var(--jp-primary-d2) !important; font-weight: 700;
  margin-bottom: 4px !important; letter-spacing: .05em;
}
.cm-prod-detail { font-size: 11px !important; color: var(--jp-ink-2); }

/* 色号表 —— 4列：序号(1#) / →箭头 / 工厂色号输入 / ✕删除 */
.cm-color-table { margin: 8px 0 !important; width:100% !important; box-sizing:border-box !important; }
.cm-color-table table,
.cm-color-table .cm-color-row {
  width: 100% !important; border-collapse: collapse !important;
  box-sizing:border-box !important;
}
.cm-color-row {
  display: grid !important;
  grid-template-columns: 46px 24px 1fr 30px !important;
  gap: 6px !important;
  padding: 5px 0 !important;
  border-bottom: 1px solid var(--jp-line-soft) !important;
  align-items: center !important;
  min-height: 34px !important;
}
.cm-color-row:first-child { font-weight:600; font-size:10px; color:var(--jp-ink-3); }
.cm-color-row .cm-customer-color {
  font-family: "Hiragino Mincho ProN","Yu Mincho","Noto Serif SC",serif !important;
  font-size: 14px !important;
  font-weight: 700 !important;
  color: var(--jp-primary-d2) !important;
  text-align: center !important;
  padding: 0 !important;
  margin: 0 !important;
  min-width:0 !important;
}
.cm-color-row .cm-customer-color input {
  width:100% !important; box-sizing:border-box !important;
  padding:5px 2px !important; font-size:12px !important; font-weight:500 !important;
  font-family: inherit !important; text-align:center !important;
  border:1px solid var(--jp-line) !important; border-radius:4px !important;
  background:#FFFDF7 !important; outline:none !important;
}
/* 添加色号按钮（早期块，使用id+class提高优先级，但属性以上面#cmAddBtn.cm-add-btn为准） */
#cmAddBtn.cm-add-btn { /* 已在下方统一写 */ }

/* 色号序号如果是输入框，统一样式 */
.cm-color-row .cm-customer-color input,
.cm-color-row > input.cm-customer-color {
  width: 100% !important;
  box-sizing: border-box !important;
  padding: 4px 2px !important;
  font-size: 13px !important;
  font-weight: 600 !important;
  font-family: inherit !important;
  text-align: center !important;
  border: 1px solid transparent !important;
  border-radius: 4px !important;
  background: transparent !important;
  color: var(--jp-primary-d2) !important;
  outline: none !important;
  transition: all .12s ease !important;
  margin: 0 !important;
  min-width: 0 !important;
  min-height: 0 !important;
  height: 22px !important;
}
.cm-color-row .cm-customer-color input:focus,
.cm-color-row > input.cm-customer-color:focus {
  border-color: var(--jp-primary, #4A6E8A) !important;
  background: #FFFDF7 !important;
}

/* 箭头 → */
.cm-color-row > div[style*="color:#11998e"] {
  font-size: 13px !important;
  color: var(--jp-ink-3) !important;
  text-align: center !important;
  padding: 0 !important;
  font-weight: 500 !important;
}
.cm-color-row input.cm-factory-input {
  width:100% !important; box-sizing:border-box !important;
  padding:6px 8px !important; font-size:12px !important;
  border:1px solid var(--jp-line) !important; border-radius:5px !important;
  background:#FFFDF7 !important; text-align:left !important;
  font-family: inherit !important; outline:none !important;
  min-width:0 !important;
  height: 30px !important;
}
.cm-color-row input:focus {
  border-color:var(--jp-primary)!important; box-shadow:0 0 0 2px rgba(74,110,138,.12)!important;
}
.cm-color-row .cm-del-btn,
.cm-color-row .cm-del-color {
  background:#2A2620 !important; color:#fff !important; border:none !important;
  border-radius:4px !important; padding:4px 0 !important; font-size:12px !important;
  cursor:pointer; width:28px !important; height:28px !important;
  display:inline-flex !important; align-items:center !important; justify-content:center !important;
  line-height:1 !important;
  justify-self:end !important;
}
/* 无色号提示文字 */
.cm-color-table > div[style*="font-size:12px"] {
  font-size: 11px !important;
  color: var(--jp-ink-3) !important;
  padding: 2px 0 6px !important;
  margin: 0 !important;
}

/* 色号管理里的表格（已保存对应关系列表）—— 防文字溢出 */
#cmMappingList table {
  width:100% !important; table-layout: fixed !important;
  font-size: 11px !important; border-collapse: collapse !important;
  background: var(--jp-surface-2) !important; border-radius:6px !important;
  overflow:hidden !important;
}
#cmMappingList table th {
  background: rgba(74,110,138,.10) !important;
  color: var(--jp-primary-d2) !important; font-weight:600 !important;
  font-size: 10px !important; padding: 5px 3px !important;
  text-align: center !important; white-space: nowrap !important;
}
#cmMappingList table th:nth-child(1) { width:18%; }
#cmMappingList table th:nth-child(2) { width:24%; }
#cmMappingList table th:nth-child(3) { width:18%; }
#cmMappingList table th:nth-child(4) { width:16%; }
#cmMappingList table th:nth-child(5) { width:24%; }
#cmMappingList table td {
  padding: 5px 3px !important; font-size: 11px !important;
  text-align: center !important;
  border-bottom: 1px solid var(--jp-line-soft) !important;
  overflow: hidden !important; text-overflow: ellipsis !important; white-space: nowrap !important;
}
#cmMappingList table td button {
  padding: 3px 6px !important; font-size: 10px !important;
  border-radius: 3px !important; border: none !important;
  color: #fff !important; cursor: pointer; margin: 0 1px !important;
  line-height:1.3 !important;
}
#cmMappingList table td button[onclick*="Edit"] {
  background: var(--jp-primary) !important;
}
#cmMappingList table td button[onclick*="Delete"] {
  background: #8B3A2E !important;
}
#cmMappingList table td span[style*="background:#fff3cd"],
#cmMappingList table td span[style*="background:#d4edda"] {
  font-size: 9px !important; padding: 1px 4px !important; border-radius:3px !important;
}

/* 添加色号 */
#cmAddBtn.cm-add-btn {
  display: block !important;
  position: static !important;
  float: none !important;
  clear: both !important;
  width: 100% !important;
  box-sizing: border-box !important;
  padding: 11px 12px !important;
  margin: 12px 0 0 0 !important;
  border: 1.5px dashed var(--jp-line, #E2DAC8) !important;
  border-radius: 8px !important;
  background: var(--jp-bg-1) !important;
  color: var(--jp-primary, #4A6E8A) !important;
  font-size: 13px !important;
  font-weight: 600 !important;
  font-family: inherit !important;
  text-align: center !important;
  letter-spacing: .05em !important;
  cursor: pointer !important;
  transition: all .15s ease !important;
  line-height: 1 !important;
  height: auto !important;
}
#cmAddBtn.cm-add-btn:hover, #cmAddBtn.cm-add-btn:active {
  background: rgba(74,110,138,.08) !important;
  border-color: var(--jp-primary, #4A6E8A) !important;
}

/* 底部操作按钮 */
#cmActionsRow.cm-actions-row {
  display: flex !important;
  position: static !important;
  float: none !important;
  clear: both !important;
  flex-direction: row !important;
  gap: 6px !important;
  width: 100% !important;
  box-sizing: border-box !important;
  padding-top: 10px !important;
  padding-bottom: 4px !important;
  margin-top: 10px !important;
  border-top: 1px solid var(--jp-line-soft) !important;
}
.cm-actions-row button {
  flex:1 1 0 !important; min-width:0 !important; padding:9px 4px !important;
  font-size:12px !important; border-radius:8px !important; border:none !important;
  font-family: inherit !important; letter-spacing:.04em !important; cursor:pointer;
  white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cm-actions-row .btn-primary {
  background:linear-gradient(180deg,#5A7E9A,#4A6E8A)!important; color:#fff!important;
}
.cm-actions-row .btn-warning {
  background:linear-gradient(180deg,#D4AA4C,#C49A3C)!important; color:#fff!important;
}
.cm-actions-row .btn-outline {
  background:var(--jp-surface)!important; color:var(--jp-ink-2)!important;
  border:1px solid var(--jp-line)!important;
}
.cm-actions-row button:active { transform:scale(.97); }

/* 空状态 */
.cm-empty-tip {
  text-align:center !important; padding:30px 16px !important;
  color: var(--jp-ink-4) !important; font-size:12px !important;
  background: var(--jp-surface-2) !important; border-radius:8px !important;
  border:1px dashed var(--jp-line) !important;
}

/* ========== 样布报单 entry-card 2x2 网格 ========== */
.entry-card {
  position: relative !important;
  background: #FFFDF7 !important;
  border: 1px solid var(--jp-line) !important;
  border-radius: 10px !important;
  padding: 10px 6px 10px !important;
  margin-bottom: 8px !important;
  box-shadow: 0 1px 3px rgba(42,38,32,.04), 0 2px 8px rgba(42,38,32,.03) !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  overflow-x: hidden !important;
}
.entry-card .entry-header {
  border-bottom: 1px dashed var(--jp-line-soft) !important;
  padding-bottom: 6px !important;
  margin-bottom: 6px !important;
  font-size: 12px !important;
  color: var(--jp-ink-3) !important;
}
.entry-card .entry-num {
  font-family: "Hiragino Mincho ProN","Yu Mincho","Noto Serif SC",serif;
  color: var(--jp-primary) !important;
  font-weight: 700;
}
.entry-card .entry-first-row {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 4px 5px !important;
  margin-bottom: 6px !important;
}
.entry-card .entry-first-row > .entry-col-short {
  width: 100% !important;
  flex: none !important;
  min-width: 0 !important;
  margin:0 !important;
}
.entry-card .entry-first-row > .entry-col-short:first-child { grid-column:1; grid-row:1; } /* 编号 左上 */
.entry-card .entry-first-row > .entry-col-short:nth-child(2) { grid-column:2; grid-row:1; } /* 客户代号 右上 */
.entry-card .entry-first-row > .factory-info-group {
  display: contents !important;
  flex: none !important;
  width: auto !important;
}
.entry-card .entry-first-row > .factory-info-group > .entry-col {
  width: 100% !important;
  min-width: 0 !important;
  margin: 0 !important;
}
.entry-card .entry-first-row > .factory-info-group > .entry-col:first-child { grid-column:1; grid-row:2; } /* 工厂名称 左下 */
.entry-card .entry-first-row > .factory-info-group > .entry-col:last-child { grid-column:2; grid-row:2; } /* 工厂编号 右下 */
.entry-card .entry-first-row input,
.entry-card .entry-first-row .entry-placeholder,
.entry-card .entry-first-row .entry-value {
  width: 100% !important;
  box-sizing: border-box !important;
  font-size: 12px !important;
  padding: 7px 6px !important;
  text-align: center !important;
  margin: 0 !important;
}
.entry-placeholder {
  border: 1px dashed var(--jp-line) !important;
  border-radius: 4px !important;
  background: var(--jp-surface-2) !important;
  min-height: 30px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  color: var(--jp-ink-4) !important;
  font-size: 11px !important;
}
.entry-value {
  border: 1px solid var(--jp-line) !important;
  border-radius: 4px !important;
  background: #FFFDF7 !important;
  min-height: 30px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  color: var(--jp-ink) !important;
  font-size: 12px !important;
  padding: 4px 6px !important;
  word-break: break-all;
}

/* 单位行：四等分均匀分布 —— "单位："/米/码/KG 四个元素等宽，左右边距对称 */
.entry-card .entry-unit-row {
  display: grid !important;
  grid-template-columns: repeat(4, 1fr) !important;
  gap: 6px !important;
  padding: 6px 0 8px !important;
  margin: 6px 0 !important;
  border-bottom: 1px solid var(--jp-line-soft) !important;
  width: 100% !important;
  box-sizing: border-box !important;
  align-items: center !important;
}
.entry-unit-label {
  font-size: 11px !important;
  color: var(--jp-ink-2);
  letter-spacing: .08em;
  text-align: center !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  height: 28px !important;
  margin: 0 !important;
}
.entry-unit-spacer { display: none !important; }
.entry-unit-options {
  display: contents !important;
}
.entry-unit-radio {
  font-size: 12px !important;
  padding: 0 !important;
  border: 1px solid var(--jp-line);
  border-radius: 5px;
  background: var(--jp-surface);
  cursor: pointer;
  transition: all .15s;
  min-width: 0 !important;
  text-align: center !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  height: 28px !important;
  letter-spacing: .05em;
  width: 100% !important;
  box-sizing: border-box !important;
}
.entry-unit-radio label, .entry-unit-radio input + *,
.entry-unit-radio * {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 100%;
  text-align: center;
  margin: 0 !important;
  padding: 0 !important;
}
.entry-unit-radio:has(input:checked) {
  background: var(--jp-primary-soft);
  border-color: var(--jp-primary);
  color: var(--jp-primary);
  font-weight: 600;
}
.entry-unit-radio input[type="radio"] { display:none; }

/* 色号表头 4列 */
.entry-card .entry-color-header {
  display: grid !important;
  grid-template-columns: 1fr 40px 1fr 38px !important;
  gap: 2px !important;
  padding: 5px 0 3px !important;
  margin: 0 0 3px !important;
  border-bottom: 1px solid var(--jp-line-soft) !important;
  width:100% !important;
  box-sizing: border-box !important;
}
.entry-card .entry-color-header .entry-col-3 {
  flex: none !important;
  width: 100% !important;
  text-align: center !important;
  font-size: 10px !important;
  padding: 0 !important;
  overflow: hidden !important;
  white-space: nowrap !important;
  color: var(--jp-ink-3) !important;
}
.entry-card .color-entry-row {
  display: grid !important;
  grid-template-columns: 1fr 40px 1fr 38px !important;
  gap: 2px !important;
  margin: 0 0 3px !important;
  width: 100% !important;
  box-sizing: border-box !important;
  align-items: center !important;
}
.entry-card .color-entry-row .entry-col-3 {
  flex: none !important;
  width: 100% !important;
  min-width: 0 !important;
  padding: 0 !important;
}
.entry-card .color-entry-row .entry-col-3 input {
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  font-size: 11px !important;
  padding: 6px 2px !important;
  text-align: center !important;
}

/* 删除按钮：墨黑底 */
.entry-card .delete-btn, button.btn-danger.delete-btn {
  position: absolute !important; top: -1px !important; right: -1px !important;
  background: #2A2620 !important; color: #FBF9F4 !important; border: none !important;
  border-radius: 0 10px 0 6px !important;
  padding: 3px 8px !important; font-size: 11px !important;
  font-weight: 500 !important; letter-spacing: .05em !important;
  box-shadow: 0 1px 3px rgba(42,38,32,.25) !important;
}
.entry-card .delete-btn:hover { background: #1A1612 !important; }
.entry-card .delete-btn:active { transform: scale(.95); }

/* ========== 添加样布按钮：内嵌卡片底部虚线样式 ========== */
.add-entry-btn {
  width: 100% !important;
  padding: 10px 12px !important;
  border: 1.5px dashed var(--jp-line) !important;
  border-radius: 8px !important;
  background: transparent !important;
  color: var(--jp-primary) !important;
  font-size: 12px !important;
  font-weight: 500 !important;
  cursor: pointer;
  transition: all .18s !important;
  font-family: inherit !important;
  margin-top: 8px !important;
  letter-spacing: .05em !important;
  position: static !important;
  height: auto !important;
  box-shadow: none !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  line-height: 1.4 !important;
}
.add-entry-btn:hover {
  border-color: var(--jp-primary) !important;
  color: var(--jp-primary) !important;
  background: var(--jp-primary-soft) !important;
}
.add-entry-btn:active { transform: scale(.985); }

/* 产品录入浮动蓝色+按钮 —— 日式化并上移到action-bar上面居中，避免遮挡KG */
div[style*="position:fixed"][style*="right:16px"][style*="bottom:80px"],
div[style*="position: fixed"][style*="right: 16px"][style*="bottom: 80px"] {
  right: auto !important;
  bottom: 82px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  z-index: 98 !important;
}
div[style*="position:fixed"] > button[onclick="openModal()"],
div[style*="position: fixed"] > button[onclick="openModal()"] {
  width: 44px !important;
  height: 44px !important;
  border-radius: 50% !important;
  border: 1px solid var(--jp-line) !important;
  background: linear-gradient(180deg,#5A7E9A,#4A6E8A) !important;
  color: #fff !important;
  box-shadow: 0 2px 8px rgba(42,38,32,.18), 0 1px 3px rgba(42,38,32,.12) !important;
  font-size: 20px !important;
  padding: 0 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  transition: transform .12s, box-shadow .12s !important;
  cursor: pointer;
}
div[style*="position:fixed"] > button[onclick="openModal()"]:active,
div[style*="position: fixed"] > button[onclick="openModal()"]:active {
  transform: scale(.93) !important;
  box-shadow: 0 1px 3px rgba(42,38,32,.2) !important;
}


/* ========== 底部操作栏 ========== */
.action-bar, .calc-process {
  position: fixed !important;
  bottom: 28px !important;
  left: 50% !important; right: auto !important;
  transform: translateX(-50%) !important;
  width: calc(100vw - 12px) !important;
  max-width: 480px !important;
  background: linear-gradient(180deg,rgba(251,249,244,.98),#F3EFE6) !important;
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--jp-line) !important;
  padding: 7px 8px !important;
  z-index: 100 !important;
  display: flex !important;
  flex-wrap: nowrap !important;
  gap: 4px !important;
  box-sizing: border-box !important;
  justify-content: center !important;
  margin: 0 !important;
  border-radius: 10px 10px 0 0 !important;
  box-shadow: 0 -2px 10px rgba(42,38,32,.08) !important;
}
/* body底部留白，防止最后一条色号行被action-bar/+/状态栏遮住 */
body { padding-bottom: 120px !important; }
.action-bar button, .calc-process button,
.action-bar .mbtn, .calc-process .mbtn {
  flex: 1 1 0 !important;
  min-width: 0 !important;
  padding: 10px 4px !important;
  font-size: 12px !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}
.calc-process {
  bottom: 28px !important;
  flex-direction: column !important;
  max-width: 480px !important;
  margin: 0 auto !important;
  max-height: 90px !important;
  overflow-y: auto;
}
.action-bar .btn, .action-bar button {
  flex: 1 1 0 !important;
  min-width: 0 !important;
  padding: 9px 4px !important;
  font-size: 11px !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  border-radius: 8px !important;
  font-weight: 500 !important;
  letter-spacing: .03em;
}
/* 清空/危险 墨黑 */
.action-bar .btn-danger, .action-bar .btn-outline[onclick*="clear"],
button[onclick*="clearData"], button[onclick*="clearProductSearch"] {
  background: linear-gradient(180deg,#3A3630,#2A2620) !important;
  color: #F6F2EA !important;
  border: none !important;
}
/* calc-process 让位 */
body.has-action-bar .calc-process { bottom: 76px !important; }

/* ========== 表格样式（v50 + customer-payment） ========== */
table {
  width: 100% !important;
  border-collapse: collapse !important;
  background: var(--jp-surface);
  border-radius: 8px;
  overflow: hidden;
  font-size: 12px;
}
table thead th {
  background: var(--jp-primary-soft) !important;
  color: var(--jp-primary-d2) !important;
  font-weight: 600 !important;
  font-size: 11px !important;
  padding: 8px 6px !important;
  border-bottom: 1px solid var(--jp-line) !important;
  text-align: center !important;
  letter-spacing: .05em;
}
table tbody tr:nth-child(odd) td { background: var(--jp-surface); }
table tbody tr:nth-child(even) td { background: var(--jp-bg); }
table tbody td {
  padding: 6px 4px !important;
  border-bottom: 1px solid var(--jp-line-soft) !important;
  text-align: center;
  color: var(--jp-ink);
  font-size: 12px;
}
table tbody td input {
  font-size: 12px !important;
  padding: 6px 4px !important;
  text-align: center !important;
}
.table-scroll, .table-wrap { overflow-x: auto !important; max-width:100% !important; }
.btn-del {
  background: #2A2620 !important; color: #FBF9F4 !important;
  border: none !important; border-radius: 4px !important;
  width: 22px !important; height: 22px !important;
  font-size: 11px !important; cursor: pointer;
}

/* ========== v50 summary ========== */
.summary {
  background: rgba(107,142,107,.08) !important;
  border: 1px solid rgba(107,142,107,.2) !important;
  border-radius: 8px !important;
  padding: 10px !important;
  margin-bottom: 10px !important;
}
.summary-grid {
  display: grid !important;
  grid-template-columns: repeat(4,1fr) !important;

// 云端同步（下载最新数据）
async function syncFromCloud() {
  setCloudStatus(' 同步中...', 'syncing');
  showToast('正在从云端同步...');

  const [workData, historyData] = await Promise.all([ossLoadWorkData(), ossLoadHistory()]);

  if (workData && workData.rows && workData.rows.length > 0) {
    document.getElementById('globalRate').value = workData.globalRate || '0.965';
    document.getElementById('globalCustomer').value = workData.globalCustomer || '';
    document.getElementById('globalColorCode').value = workData.globalColorCode || '';
    rows = workData.rows;
    idCounter = workData.idCounter || 0;
    if (workData.rateMode) { rateMode = workData.rateMode; syncRateUI(); }
    localStorage.setItem('meterConverterData', JSON.stringify(workData));
  }

  if (historyData) {
    // 合并 delivered 状态：以云端为准，但保留本地的 delivered 标记
    const localHistory = JSON.parse(localStorage.getItem('meterConverterHistory') || '[]');
    const localDeliveredMap = {};
    localHistory.forEach(h => { if (h.delivered) localDeliveredMap[h.id] = true; });
    // 同时，以本地的 delivered 状态合并到云端数据
    historyData.forEach(h => {
      if (localDeliveredMap[h.id]) h.delivered = true;
    });
    localStorage.setItem('meterConverterHistory', JSON.stringify(historyData));
  }

  cloudSynced = true;
  render();
  renderHistoryDateList();
  setCloudStatus(' 已同步', '');
  showToast('云端同步完成');
}

    };

    // === 自动同步数据到共享存储 ===

      var syncColors = {};

function updateCustomerSuggestionsV50() {
  var input = document.getElementById('globalCustomer');

  var list = document.getElementById('customerNameListV50');
  if (!list) return;
  list.innerHTML = '';
  var customers = JSON.parse(localStorage.getItem('customerNames') || '[]');
  // Also get from shared data
  var raw = localStorage.getItem('friendshipTool_sharedData');
  if (raw) {
    try {
      var sd = JSON.parse(raw);
      if (sd.customers) {
        var sc = sd.customers;
        if (typeof sc === 'object' && !Array.isArray(sc)) {
          Object.keys(sc).forEach(function(k) { if (customers.indexOf(k) === -1) customers.push(k); });
        } else if (Array.isArray(sc)) {
          sc.forEach(function(c) { if (customers.indexOf(c) === -1) customers.push(c); });
        }
      }
    } catch(e) {}
  }
  customers.forEach(function(name) {
    var opt = document.createElement('option');
    opt.value = name;
    list.appendChild(opt);
  });
}

    opt.value = item.name;

// ===== 初始化 =====
async function init() {
  const isCleanInit = !localStorage.getItem('cleanV20260719');
  if (isCleanInit) {
    localStorage.clear();
    localStorage.setItem('cleanV20260719', '1');
    // 云端旧数据因签名问题无法远程清除，跳过云端加载即可
  }
  initOSS();
  // 如果是全新初始化，跳过所有旧数据加载
  if (isCleanInit) {
    render();
    return;
  }
  // 优先从本地加载
  const hasLocal = loadData();
  // 尝试从云端加载（仅当云端有实际数据时才覆盖本地）
  const cloudData = await ossLoadWorkData();
  if (cloudData && cloudData.rows && cloudData.rows.length > 0) {
    // 清理旧数据：条数模式→米数，转换率强制重置为默认值
    if (cloudData.rateMode === 'strip') cloudData.rateMode = 'meter';
    const modeDefaults = { meter: '0.965', kg: '2', yard: '0' };
    const defaultRate = modeDefaults[cloudData.rateMode] || '0.965';
    if (cloudData.globalRate && cloudData.globalRate !== defaultRate) {
      // 如果云端存的转换率和当前模式默认值不一样，用默认值覆盖
      cloudData.globalRate = defaultRate;
    }
    document.getElementById('globalRate').value = cloudData.globalRate || defaultRate;
    document.getElementById('globalCustomer').value = cloudData.globalCustomer || '';
    document.getElementById('globalColorCode').value = cloudData.globalColorCode || '';
    rows = cloudData.rows;
    idCounter = cloudData.idCounter || 0;
    if (cloudData.rateMode) { rateMode = cloudData.rateMode; syncRateUI(); }
    localStorage.setItem('meterConverterData', JSON.stringify(cloudData));
    cloudSynced = true;
  }
  // 本地也没有则不添加默认行（页面空白，等用户手动新增）
  // 加载历史：仅当本地没有数据时才从云端加载
  const localHistory = JSON.parse(localStorage.getItem('meterConverterHistory') || '[]');
  if (localHistory.length === 0) {
    const cloudHistory = await ossLoadHistory();
    if (cloudHistory && cloudHistory.length > 0) {
      localStorage.setItem('meterConverterHistory', JSON.stringify(cloudHistory));
      cloudSynced = true;
    }
  } else {
    // 本地有数据，尝试合并云端的新增记录（保留本地 delivered 状态）
    const cloudHistory = await ossLoadHistory();
    if (cloudHistory && cloudHistory.length > 0) {
      const localIds = new Set(localHistory.map(h => h.id));
      const localDeliveredMap = {};
      localHistory.forEach(h => { if (h.delivered) localDeliveredMap[h.id] = true; });
      // 把云端新增的记录合并进来
      cloudHistory.forEach(h => {
        if (!localIds.has(h.id)) {
          localHistory.push(h);
        } else if (localDeliveredMap[h.id]) {
          // 保留本地的 delivered 状态
          const existing = localHistory.find(lh => lh.id === h.id);
          if (existing) existing.delivered = true;
        }
      });
      localStorage.setItem('meterConverterHistory', JSON.stringify(localHistory));
    }
  }
  // 加载工厂报数历史：仅当本地没有时才从云端加载
  const localFactory = JSON.parse(localStorage.getItem('meterConverterFactoryHistory') || '[]');
  if (localFactory.length === 0) {
    const cloudFactory = await ossLoadFactoryHistory();
    if (cloudFactory && cloudFactory.length > 0) {
      localStorage.setItem('meterConverterFactoryHistory', JSON.stringify(cloudFactory));
    }
  }
  render();
  // 检查是否有新版本
  checkVersionUpdate();
}

// ===== 回车键处理 =====
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  const input = e.target;
  if (!input.closest('tbody')) return;
  e.preventDefault();
  const tr = input.closest('tr');
  const origInput = tr.querySelector('.row-orig');
  const origVal = parseFloat(origInput.value);
  if (!origVal || origVal <= 0) { showToast('请先输入原数量'); origInput.focus(); return; }
  const allRows = document.querySelectorAll('#tableBody tr');
  const currentIdx = Array.from(allRows).indexOf(tr);
  const isLastRow = currentIdx === allRows.length - 1;
  if (isLastRow) { addRow(); }
  else {
    setTimeout(() => {
      const nextRow = allRows[currentIdx + 1];
      const nextInput = nextRow.querySelector('.row-orig');
      if (nextInput) {
        nextInput.focus(); nextInput.select();
        nextRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }, 30);
  }
});

function addRowData(origMeters, rate, customerName = '', colorCode = '', selfCode = '') {
  idCounter++;
  rows.push({ id: idCounter, index: rows.length + 1, customerName, colorCode, selfCode, origMeters, rate });
}

function addRow() {
  const rate = parseFloat(document.getElementById('globalRate').value) || (rateMode === 'kg' ? 2 : (rateMode === 'yard' ? 0 : 0.965));
  const customerName = document.getElementById('globalCustomer').value.trim();
  // 继承上一行的色号，如果上一行没有色号则为空
  let colorCode = '';
  let selfCode = '';
  if (rows.length > 0) {
    const lastRow = rows[rows.length - 1];
    colorCode = lastRow.colorCode || '';
    selfCode = lastRow.selfCode || '';
  }
  addRowData('', rate, customerName, colorCode, selfCode);
  render();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.row-orig');
    if (inputs.length > 0) {
      inputs[inputs.length - 1].focus(); inputs[inputs.length - 1].select();
      inputs[inputs.length - 1].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }, 50);
}

function deleteRow(id) { rows = rows.filter(r => r.id !== id); reindex(); render(); }
function reindex() { rows.forEach((r, i) => r.index = i + 1); }

function calcConverted(orig, rate) {
  if (!orig) return 0;
  if (rateMode === 'kg' || rateMode === 'yard') {
    if (rate === '' || rate === undefined || rate === null) return 0;
    return Math.round(orig + Number(rate));
  }
  if (!rate) return 0;
  var absRate = Math.abs(rate);
  if (rate < 0) return Math.round(orig * (absRate / 100));
  return round1(orig / absRate);
}

function saveRateVal() {
  var el = document.getElementById('globalRate');
  if (rateMode === 'meter') el.dataset.meterVal = el.value;
  else if (rateMode === 'kg') el.dataset.kgVal = el.value;
  else if (rateMode === 'yard') el.dataset.yardVal = el.value;
  render();
}

function render() {
  const tbody = document.getElementById('tableBody');
  let html = '';
  let prevColor = '';
  rows.forEach((r, i) => {
    var converted = calcConverted(r.origMeters, r.rate);
    var sepClass = (i > 0 && r.colorCode !== prevColor && r.colorCode && prevColor) ? ' group-separator' : '';
    prevColor = r.colorCode || '';
    html += '<tr class="' + sepClass + '">' +
      '<td class="td-index">' + (i+1) + '</td>' +
      '<td class="td-color"><input class="row-factory-color" type="text" value="' + (r.colorCode||'') + '" placeholder="工厂色号" oninput="updateField(' + r.id + ',\'colorCode\',this.value);onColorInput(this)" onblur="setTimeout(function(el){hideColorSuggestion();autoAddHash(el)},200,this)" autocomplete="off"></td>' +
      '<td class="td-color" style="background:#f0e2d0;"><input class="row-color" type="text" value="' + (r.selfCode||'') + '" placeholder="自编色号" style="color:#8b5e3c;font-weight:700;" oninput="updateField(' + r.id + ',\'selfCode\',this.value);onColorInput(this)" onblur="setTimeout(function(el){hideColorSuggestion();autoAddHash(el)},200,this)" autocomplete="off"></td>' +

// ===== 色号联想功能 =====
function onColorInput(el) {
  var val = el.value.trim();
  var cid = el.getAttribute('data-cid') || el.id;
  var suggestBox = document.getElementById('color-suggest-' + cid);
  if (!suggestBox) {
    suggestBox = document.createElement('div');
    suggestBox.id = 'color-suggest-' + cid;
    suggestBox.className = 'color-suggest-box';
    suggestBox.style.cssText = 'display:none;position:absolute;z-index:100;background:#fff;border:1px solid #ddd;border-radius:4px;max-height:200px;overflow-y:auto;box-shadow:0 2px 8px rgba(0,0,0,0.1);';
    document.body.appendChild(suggestBox);
  }
  
  if (!val || val.length < 1) {
    suggestBox.style.display = 'none';
    return;
  }
  
  var history = [];
  try {
    var saved = localStorage.getItem('youyi_color_history');
    if (saved) history = JSON.parse(saved);
  } catch(e) {}
  
  var matches = [];
  for (var i = 0; i < history.length; i++) {
    if (history[i].toLowerCase().indexOf(val.toLowerCase()) === 0) {
      matches.push(history[i]);
      if (matches.length >= 10) break;
    }
  }
  if (matches.length < 10) {
    for (var i = 0; i < history.length; i++) {
      if (matches.indexOf(history[i]) === -1 && history[i].toLowerCase().indexOf(val.toLowerCase()) !== -1) {
        matches.push(history[i]);
        if (matches.length >= 10) break;
      }
    }
  }
  
  if (matches.length === 0) {
    suggestBox.style.display = 'none';
    return;
  }
  
  var html = '';
  for (var i = 0; i < matches.length; i++) {
    html += '<div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f5f5f5;font-size:13px;" ' +
      'onmouseover="this.style.background=\'#fff7e6\'" onmouseout="this.style.background=\'#fff\'" ' +
      'onmousedown="selectColorSuggestion(this,\'' + matches[i].replace(/'/g, "\\'") + '\')">' +
      matches[i] + '</div>';
  }
  suggestBox.innerHTML = html;
  suggestBox.style.display = 'block';
  
  var rect = el.getBoundingClientRect();
  suggestBox.style.left = rect.left + 'px';
  suggestBox.style.top = (rect.bottom + window.scrollY) + 'px';
  suggestBox.style.width = rect.width + 'px';
}

function selectColorSuggestion(div, value) {
  var input = div.parentElement.previousElementSibling || div.parentElement.parentElement.querySelector('input.color-input');
  if (input) input.value = value;
  hideColorSuggestion();
  saveColorToHistory(value);
}

function hideColorSuggestion() {
  var boxes = document.querySelectorAll('.color-suggest-box');
  for (var i = 0; i < boxes.length; i++) {
    boxes[i].style.display = 'none';
  }
}

function saveColorToHistory(colorCode) {
  if (!colorCode) return;
  var history = [];
  try {
    var saved = localStorage.getItem('youyi_color_history');
    if (saved) history = JSON.parse(saved);
  } catch(e) {}
  
  if (history.indexOf(colorCode) === -1) {
    history.unshift(colorCode);
    if (history.length > 100) history = history.slice(0, 100);
    try {
      localStorage.setItem('youyi_color_history', JSON.stringify(history));
    } catch(e) {}
  }
}

function autoAddHash(el) {
  var v = el.value.trim();
  if (v && !v.endsWith('#')) {
    el.value = v + '#';
    var field = el.classList.contains('row-factory-color') ? 'colorCode' : 'selfCode';
    updateField(parseInt(el.closest('tr').querySelector('.btn-del').getAttribute('onclick').match(/\d+/)), field, el.value);

}
function syncAllRowRates(value) {
  const rate = parseFloat(value) || 0;
  rows.forEach(r => r.rate = rate);
  render();
}

function updateField(id, field, value) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  if (field === 'origMeters' || field === 'rate') row[field] = parseFloat(value) || 0;
  else if (field === 'colorCode' || field === 'customerName' || field === 'selfCode') row[field] = value;
  updateSummary(); updateFormula();
  const tr = document.querySelector('[onclick="deleteRow(' + id + ')"]').closest('tr');
  tr.querySelector('.td-result').textContent = calcConverted(row.origMeters, row.rate) || '-';
}



function updateSummary() {
  const validRows = rows.filter(r => r.origMeters > 0 && r.rate !== '');
  let sumOrig = 0, sumConv = 0;
  validRows.forEach(r => { const c = calcConverted(r.origMeters, r.rate); sumOrig += r.origMeters; sumConv += c; });
  document.getElementById('sumCount').textContent = validRows.length;
  document.getElementById('sumOrig').textContent = round1(sumOrig);
  document.getElementById('sumConv').textContent = round1(sumConv);
  document.getElementById('sumDiff').textContent = round1(sumConv - sumOrig);
}

function updateFormula() {
  const validRows = rows.filter(r => r.origMeters > 0 && r.rate !== '');
  const el = document.getElementById('formulaDisplay');
  if (validRows.length === 0) { el.innerHTML = '暂无数据'; return; }
  const groups = []; let cur = null;
  validRows.forEach(r => {
    const color = r.colorCode || '';
    if (cur && cur.color === color) cur.items.push(r);
    else { cur = { color, items: [r] }; groups.push(cur); }
  });
  var unit = rateMode === 'kg' ? 'KG' : (rateMode === 'yard' ? 'Y' : '米');
  let html = '';
  groups.forEach((g, gi) => {
    const vals = g.items.map(r => calcConverted(r.origMeters, r.rate));
    if (gi > 0) html += '<br>';
    var colorLabel = g.color ? (g.color.indexOf('#') === -1 ? g.color + '#' : g.color) : '';
    if (colorLabel) html += '<span style="color:#ff7a00;font-weight:600;">' + colorLabel + '</span>：';
    if (vals.length === 1) html += '<span class="num">' + vals[0] + unit + '</span>';
    else { const sum = round1(vals.reduce((a,b)=>a+b,0)); html += vals.map(v=>'<span class="num">' + v + unit + '</span>').join(' + ') + ' = <span class="num">' + sum + unit + '</span>'; }
  });
  el.innerHTML = html;
}

function round1(n) { return Math.round(n); }

function validateCopyFields() {
  const errors = [];
  const customer = document.getElementById('globalCustomer').value.trim();
  const orderCode = document.getElementById('globalColorCode').value.trim();
  const validRows = rows.filter(r => r.origMeters > 0 && r.rate !== '');
  if (!customer) errors.push('客户名称');
  if (!orderCode) errors.push('色卡编号');
  if (validRows.length === 0) errors.push('原数量数据');
  const emptyColorRows = validRows.filter(r => !r.selfCode || !r.selfCode.trim());
  if (emptyColorRows.length > 0) errors.push('部分行未填色号');
  return errors;
}

function copyConverted() {
  const errors = validateCopyFields();
  if (errors.length > 0) { showToast('复制失败：请填写 ' + errors.join('、')); return; }
  const customer = document.getElementById('globalCustomer').value.trim();
  const orderCode = document.getElementById('globalColorCode').value.trim();
  const validRows = rows.filter(r => r.origMeters > 0 && r.rate !== '');
  const groups = []; let cur = null;
  validRows.forEach(r => { const c = r.selfCode||''; if(cur&&cur.color===c)cur.items.push(r); else{cur={color:c,items:[r]};groups.push(cur);} });
  let text = '';
  if (customer) text += customer + '\n';
  if (orderCode) text += '下单编号：' + orderCode + '\n';
  if (text) text += '\n';
  var unit = rateMode === 'kg' ? 'KG' : (rateMode === 'yard' ? 'Y' : '米');
  groups.forEach(g => {
    const vals = g.items.map(r => calcConverted(r.origMeters, r.rate));
    const sum = round1(vals.reduce((a,b)=>a+b,0));
    var colorLabel = g.color ? (g.color.indexOf('#') === -1 ? g.color + '#' : g.color) + '：' : '';
    if (g.color) text += colorLabel + sum + unit + '\n';
    else vals.forEach(v => text += v + unit + '\n');
  });
  copyText(text.trim());
}

function copyFormula() {
  const errors = validateCopyFields();
  if (errors.length > 0) { showToast('复制失败：请填写 ' + errors.join('、')); return; }
  const customer = document.getElementById('globalCustomer').value.trim();
  const orderCode = document.getElementById('globalColorCode').value.trim();
  const validRows = rows.filter(r => r.origMeters > 0 && r.rate !== '');
  const groups = []; let cur = null;
  validRows.forEach(r => { const c = r.colorCode||''; if(cur&&cur.color===c)cur.items.push(r); else{cur={color:c,items:[r]};groups.push(cur);} });
  let text = '';
  if (customer) text += customer + '\n';
  if (orderCode) text += '下单编号：' + orderCode + '\n';
  if (text) text += '\n';
  var unit = rateMode === 'kg' ? 'KG' : (rateMode === 'yard' ? 'Y' : '米');
  groups.forEach(g => {
    const vals = g.items.map(r => calcConverted(r.origMeters, r.rate));
    const valsWithUnit = vals.map(v => v + unit);
    const sum = round1(vals.reduce((a,b)=>a+b,0));
    var colorLabel = g.color ? (g.color.indexOf('#') === -1 ? g.color + '#' : g.color) + '：' : '';
    if (g.color) text += colorLabel + valsWithUnit.join(' + ') + ' = ' + sum + unit + '\n';
    else text += valsWithUnit.join(' + ') + ' = ' + sum + unit + '\n';
  });
  copyText(text.trim());
}

function copyText(text) {
  // 方法1：现代剪贴板API
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
    navigator.clipboard.writeText(text).then(()=>{
      showToast('已复制');
    }).catch(()=>{
      // 方法2：textarea + execCommand（iOS兼容）
      fallbackCopy(text);
    });
  } else {
    // 方法2：textarea + execCommand（iOS兼容）
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:none;outline:none;boxShadow:none;background:transparent;opacity:0.01;';
  ta.setAttribute('readonly', '');
  ta.style.userSelect = 'text';
  ta.style.webkitUserSelect = 'text';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);
  try {
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) { showToast('已复制'); return; }
  } catch(e) {}
  document.body.removeChild(ta);
  // 方法3：弹出手动复制框
  promptCopy(text);
}

function promptCopy(text) {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  modal.innerHTML = '<div style="background:#fff;border-radius:12px;padding:20px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.15);">' +
    '<div style="font-size:16px;font-weight:600;margin-bottom:12px;text-align:center;">请手动复制以下内容</div>' +
    '<textarea id="copyModalText" style="width:100%;height:180px;border:1px solid #e0e0e0;border-radius:6px;padding:10px;font-size:14px;line-height:1.5;resize:none;background:#F5FBF5;">' + escaped + '</textarea>' +
    '<button id="copyModalBtn" style="width:100%;margin-top:12px;padding:12px;background:#2E7D32;color:#fff;border:none;border-radius:3px;font-size:15px;font-weight:600;cursor:pointer;">📋 点击复制</button>' +
    '<button onclick="this.parentElement.parentElement.remove()" style="width:100%;margin-top:8px;padding:10px;background:#f5f5f5;color:#666;border:none;border-radius:3px;font-size:14px;">关闭</button>' +
    '</div>';
  document.body.appendChild(modal);
  // 绑定复制按钮事件
  var btn = document.getElementById('copyModalBtn');
  var ta = document.getElementById('copyModalText');
  btn.onclick = function() {
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try {
      if (document.execCommand('copy')) {
        btn.textContent = '✅ 已复制!';
        btn.style.background = '#52c41a';
        setTimeout(function(){ modal.remove(); }, 1000);
        return;
      }
    } catch(e) {}
    // execCommand 也失败，提示用户手动长按复制
    btn.textContent = '请长按文本手动复制';
    btn.style.background = '#fa8c16';
    ta.focus();
  };
}

function importCSV(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split(/[\r\n]+/).filter(l=>l.trim());
    const rate = parseFloat(document.getElementById('globalRate').value) || 0.965;
    const customerName = document.getElementById('globalCustomer').value.trim();
    const colorCode = document.getElementById('globalColorCode').value.trim();
    let imported = 0;
    lines.forEach(line => {
      const cols = line.split(/[,\t\s]+/);
      const num = parseFloat(cols[cols.length-1]);
      if (!isNaN(num) && num > 0) { addRowData(num, rate, customerName, colorCode); imported++; }
    });
    if (imported > 0) { render(); showToast('成功导入 ' + imported + ' 条数据'); }
    else showToast('未识别到有效数据');
    event.target.value = '';
  };
  reader.readAsText(file);
}

function showToast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1500);
}

document.getElementById('globalRate').addEventListener('change', function() {
