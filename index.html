<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土土协作</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    padding: 12px;
  }
  .container {
    max-width: 360px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .header {
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    padding: 16px;
    text-align: center;
    color: #fff;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
  }
  .menu {
    padding: 12px;
  }
  .menu-item {
    display: block;
    padding: 14px 16px;
    margin-bottom: 8px;
    background: #fafafa;
    border-radius: 8px;
    text-decoration: none;
    color: #333;
    border: 1px solid #e8e8e8;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
    touch-action: manipulation;
    cursor: pointer;
  }
  .menu-item:last-child {
    margin-bottom: 0;
  }
  .menu-item:active {
    background: #e8e8e8;
  }
  .menu-row {
    display: flex;
    align-items: center;
  }
  .menu-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-right: 12px;
    color: #fff;
    flex-shrink: 0;
  }
  .icon-sample { background: #667eea; }
  .icon-cargo { background: #f5576c; }
  .icon-payment { background: #4facfe; }
  .icon-calc { background: #43e97b; }
  .menu-text {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }
  .menu-arrow {
    color: #ccc;
    font-size: 18px;
  }
  .footer {
    text-align: center;
    padding: 10px;
    background: #fafafa;
    border-top: 1px solid #e8e8e8;
    font-size: 11px;
    color: #999;
  }

  /* 更新按钮 */
  .update-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 0 12px 12px;
    padding: 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
    touch-action: manipulation;
  }
  .update-btn:active { opacity: 0.8; }

  /* 模态框 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 12px;
    width: 320px;
    max-width: 90%;
    overflow: hidden;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
  }
  .modal-body { padding: 20px; }
  .update-log { margin-bottom: 16px; }
  .update-log h3 { font-size: 14px; color: #333; margin-bottom: 8px; }
  .update-log ul { list-style: none; padding-left: 0; }
  .update-log li {
    font-size: 13px; color: #666;
    padding: 4px 0 4px 16px;
    position: relative;
  }
  .update-log li:before {
    content: "•"; position: absolute; left: 0; color: #667eea;
  }
  .progress-container { display: none; margin-top: 16px; }
  .progress-bar {
    width: 100%; height: 24px;
    background: #f0f0f0; border-radius: 12px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    border-radius: 12px;
    width: 0%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 600;
    transition: width 0.3s ease;
  }
  .progress-text {
    text-align: center; margin-top: 8px;
    font-size: 13px; color: #666;
  }
  .success-box {
    display: none; text-align: center; padding: 20px;
  }
  .success-box .checkmark { font-size: 48px; color: #43e97b; }
  .success-box p { font-size: 15px; color: #333; font-weight: 500; margin-top: 8px; }
  .modal-footer { padding: 12px 20px 20px; text-align: center; }
  .mbtn {
    display: block; width: 100%;
    padding: 12px; margin-top: 8px;
    border: none; border-radius: 8px;
    font-size: 15px; font-weight: 500;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
    touch-action: manipulation;
  }
  .mbtn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
  }
  .mbtn-cancel { background: #f0f0f0; color: #666; }
  .mbtn:active { opacity: 0.8; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐸 土土协作</h1>
    </div>

    <div class="menu">
      <a href="sample-report.html" class="menu-item" target="_blank">
        <div class="menu-row">
          <div class="menu-icon icon-sample">📋</div>
          <div class="menu-text">样布报单</div>
          <div class="menu-arrow">›</div>
        </div>
      </a>

      <a href="v50.html" class="menu-item" target="_blank">
        <div class="menu-row">
          <div class="menu-icon icon-cargo">📦</div>
          <div class="menu-text">大货报单</div>
          <div class="menu-arrow">›</div>
        </div>
      </a>

      <a href="customer-payment.html" class="menu-item" target="_blank">
        <div class="menu-row">
          <div class="menu-icon icon-payment">💰</div>
          <div class="menu-text">客户公账</div>
          <div class="menu-arrow">›</div>
        </div>
      </a>

      <a href="index.html" class="menu-item" target="_blank">
        <div class="menu-row">
          <div class="menu-icon icon-calc">📏</div>
          <div class="menu-text">米数换算</div>
          <div class="menu-arrow">›</div>
        </div>
      </a>
    </div>

    <button class="update-btn" onclick="showUpdateModal()">🔄 更新版本</button>

    <div class="footer">云端版 v2.0.0</div>
  </div>

  <!-- 模态框 -->
  <div class="modal-overlay" id="updateModal">
    <div class="modal-box">
      <div class="modal-header">版本更新</div>
      <div class="modal-body">
        <div class="update-log" id="updateLog">
          <h3>v2.0.0 更新内容</h3>
          <ul>
            <li>新增云端部署，刷新即最新版</li>
            <li>优化文件大小，加载更快</li>
            <li>新增版本更新功能</li>
            <li>修复多个已知问题</li>
          </ul>
        </div>
        <div class="progress-container" id="progressContainer">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill">0%</div>
          </div>
          <div class="progress-text" id="progressText">正在更新...</div>
        </div>
        <div class="success-box" id="successBox">
          <div class="checkmark">✓</div>
          <p>更新成功！</p>
        </div>
      </div>
      <div class="modal-footer" id="modalFooter">
        <button class="mbtn mbtn-primary" onclick="startUpdate()">立即更新</button>
        <button class="mbtn mbtn-cancel" onclick="closeModal()">稍后再说</button>
      </div>
    </div>
  </div>

  <script>
    function showUpdateModal() {
      document.getElementById('updateModal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('updateModal').classList.remove('show');
      setTimeout(function() {
        document.getElementById('progressContainer').style.display = 'none';
        document.getElementById('successBox').style.display = 'none';
        document.getElementById('updateLog').style.display = 'block';
        document.getElementById('modalFooter').style.display = 'block';
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('progressFill').textContent = '0%';
      }, 300);
    }
    function startUpdate() {
      document.getElementById('modalFooter').style.display = 'none';
      document.getElementById('updateLog').style.display = 'none';
      document.getElementById('progressContainer').style.display = 'block';
      var progress = 0;
      var interval = setInterval(function() {
        progress += Math.random() * 10 + 5;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          setTimeout(function() {
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('successBox').style.display = 'block';
            setTimeout(function() {
              closeModal();
              window.location.reload(true);
            }, 1500);
          }, 500);
        }
        var pct = Math.floor(progress);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressFill').textContent = pct + '%';
      }, 200);
    }
    // 点击遮罩关闭
    document.getElementById('updateModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
