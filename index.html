<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土土协作</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #fafafa; color: #222; padding: 12px; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
.container { max-width: 600px; margin: 0 auto; width: 100%; background: #fff; border-radius: 4px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); border: 1px solid #eaeaea; padding: 16px; position: relative; }
h1 { text-align: center; font-size: 18px; color: #111; margin-bottom: 4px; font-weight: 700; letter-spacing: 0.5px; }
.subtitle { text-align: center; font-size: 12px; color: #999; margin-bottom: 16px; }
.menu-item { background: #fafafa; border-radius: 4px; padding: 16px; margin-bottom: 10px; border: 1px solid #eee; text-decoration: none; display: flex; align-items: center; transition: background 0.15s; }
.menu-item:hover { background: #f0f0f0; }
.menu-item:active { background: #e8e8e8; }
.menu-icon { font-size: 28px; margin-right: 14px; }
.menu-text { flex: 1; }
.menu-title { font-size: 16px; font-weight: 600; color: #111; }
.menu-desc { font-size: 12px; color: #888; margin-top: 3px; }
.menu-arrow { color: #ccc; font-size: 18px; }
.version-btn { position: fixed; bottom: 20px; right: 20px; background: #fff; border: 1px solid #ddd; border-radius: 50%; width: 44px; height: 44px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); cursor: pointer; font-size: 18px; }
.update-btn { position: fixed; bottom: 70px; right: 20px; background: #fff; border: 1px solid #ddd; border-radius: 50%; width: 44px; height: 44px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); cursor: pointer; font-size: 18px; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 4px; padding: 20px; max-width: 400px; width: 90%; border: 1px solid #eaeaea; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.modal h2 { font-size: 16px; margin-bottom: 12px; color: #111; font-weight: 700; }
.modal p { font-size: 13px; color: #666; margin-bottom: 6px; line-height: 1.6; }
.modal-close { background: #111; color: #fff; border: none; border-radius: 3px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; width: 100%; }
</style>
</head>
<body>
<div class="container">
<h1>土土协作</h1>
<p class="subtitle">友谊纺织 · 销售团队工具</p>
  <a class="menu-item" href="sample-report.html?v=20260818g">
    <div class="menu-icon">📋</div>
    <div class="menu-text">
      <div class="menu-title">样布报单</div>
      <div class="menu-desc">样布下单、查询、统计</div>
    </div>
    <div class="menu-arrow">›</div>
  </a>
  <a class="menu-item" href="v50.html">
    <div class="menu-icon">📦</div>
    <div class="menu-text">
      <div class="menu-title">大货报单</div>
      <div class="menu-desc">大货下单、工厂报数、统计</div>
    </div>
    <div class="menu-arrow">›</div>
  </a>
  <a class="menu-item" href="customer-payment.html">
    <div class="menu-icon">💰</div>
    <div class="menu-text">
      <div class="menu-title">客户公账</div>
      <div class="menu-desc">客户账务管理</div>
    </div>
    <div class="menu-arrow">›</div>
  </a>
</div>
<button class="version-btn" onclick="showVersion()">📝</button>
<button class="update-btn" onclick="checkUpdate()">🔄</button>

<div class="modal-overlay" id="update-modal">
  <div class="modal">
    <h2 id="update-title">检查更新...</h2>
    <p id="update-message">正在从服务器获取最新版本</p>
    <button class="modal-close" onclick="closeUpdateModal()">关闭</button>
  </div>
</div>

<div class="modal-overlay" id="version-modal">
  <div class="modal">
    <h2>版本更新 v2.4.1</h2>
    <p><strong>2026-08-19</strong></p>
    <p>• 主页面改为 V50 固定卡片风格</p>
    <p>• 修复样布页面点击无反应问题</p>
    <p>• 修复大货搜索 881082 无结果问题</p>
    <p>• 改用直接导航（不再用 iframe）</p>
    <p>• 产品编号：11,252 个</p>
    <p>• 客户数据：808 家</p>
    <p>• 工厂数据：90 家</p>
    <button class="modal-close" onclick="closeVersion()">关闭</button>
  </div>
</div>

<script>
function showVersion() {
  document.getElementById('version-modal').classList.add('show');
}
function closeVersion() {
  document.getElementById('version-modal').classList.remove('show');
}

// 检查更新（仅 EXE 版本有效）
function checkUpdate() {
  if (typeof window.electronAPI === 'undefined') {
    alert('网页版请刷新浏览器缓存获取最新版本');
    return;
  }
  
  document.getElementById('update-modal').classList.add('show');
  document.getElementById('update-title').textContent = '检查更新...';
  document.getElementById('update-message').textContent = '正在从服务器获取最新版本';
  
  // 更新所有 HTML 文件
  const files = ['index.html', 'sample-report.html', 'v50.html'];
  let completed = 0;
  let success = 0;
  
  files.forEach(file => {
    window.electronAPI.updateHTML(file);
  });
  
  window.electronAPI.onUpdateResult((result) => {
    completed++;
    if (result.success) success++;
    
    if (completed === files.length) {
      document.getElementById('update-title').textContent = success > 0 ? '✅ 更新完成' : '❌ 更新失败';
      document.getElementById('update-message').textContent = success > 0 ? `成功更新 ${success} 个文件，请重启应用` : '网络错误，请检查网络连接';
    }
  });
}

function closeUpdateModal() {
  document.getElementById('update-modal').classList.remove('show');
  if (typeof window.electronAPI !== 'undefined') {
    // 提示重启
    if (confirm('更新完成，是否立即重启？')) {
      location.reload();
    }
  }
}
</script>
</body>
</html>
