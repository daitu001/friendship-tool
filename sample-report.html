// 保存自编对应关系到OSS
function cmSaveCustomMapping() {
  var colorCardNo = document.getElementById('cmSelfColorCardNo').value.trim();
  var factoryName = document.getElementById('cmSelfFactoryName').value.trim();
  var factoryCode = document.getElementById('cmSelfFactoryCode').value.trim();
  if (!colorCardNo || !factoryName || !factoryCode) {
    showToast('色卡编号、工厂名称、工厂编号为必填项');
    return;
  }
  // 保存工厂名称映射
  if (factoryName && factoryCode) {
    if (typeof FriendshipSync !== 'undefined' && FriendshipSync.syncFactoryNameMap) {
      FriendshipSync.syncFactoryNameMap(factoryName, factoryCode);
    }
  }
  // 自编产品也存进云端产品表，让云端搜索能搜到
  if (typeof FriendshipSync !== 'undefined' && FriendshipSync.syncProduct) {
    FriendshipSync.syncProduct(colorCardNo, {
      f: factoryName,
      fc: factoryCode,
      s: '自编',
      p: '',
      updatedBy: 'tutuCollab',
      updatedAt: new Date().toISOString()
    });
  }
  // 同时写入 userProducts（getMergedDB 读取源），让本机搜索立即生效
  try {
    var up = JSON.parse(localStorage.getItem('userProducts') || '{}');
    if (!up[colorCardNo]) {
      up[colorCardNo] = [{ f: factoryName, fc: factoryCode, s: '自编', p: '' }];
      localStorage.setItem('userProducts', JSON.stringify(up));
      if (typeof userProducts !== 'undefined') userProducts = up;
    }
  } catch(e) { console.error(e); }
  // 保存到本地映射列表
  var localList = JSON.parse(localStorage.getItem('cmCustomMappings') || '[]');
  localList.push({
    colorCardNo: colorCardNo,
    factoryName: factoryName,
    factoryCode: factoryCode,
    source: '手动编',
    time: new Date().toLocaleString()
  });
  localStorage.setItem('cmCustomMappings', JSON.stringify(localList));
  // 上传到OSS
  if (typeof uploadSharedDataToOSS === 'function') {
    uploadSharedDataToOSS().catch(function(e) { console.error(e); });
  }
  cmLoadMappingList();
  showToast('✅ 对应关系已保存 [手动编]');
  // 显示刚保存的这一条
  var lastSavedEl = document.getElementById('cmLastSaved');
  var lastSavedContent = document.getElementById('cmLastSavedContent');
  if (lastSavedEl && lastSavedContent) {
    lastSavedContent.innerHTML = '<strong>' + colorCardNo + '</strong> | ' + factoryName + ' | ' + factoryCode + ' <span style="background:#fff3cd;color:#856404;padding:1px 5px;border-radius:3px;font-size:10px;white-space:nowrap;">手动编</span>';
    lastSavedEl.style.display = 'block';
  }
  // 先清空第一排输入框（防止后续代码异常导致清不掉）
  document.getElementById('cmSelfColorCardNo').value = '';
  document.getElementById('cmSelfFactoryName').value = '';
  document.getElementById('cmSelfFactoryCode').value = '';
  // 保存后自动展开色号列表，用色卡编号作为产品代码
  if (colorCardNo) {
    try { cmSelectProduct(colorCardNo); } catch(e) { console.error('展开色号列表失败:', e); }
  }
}

// 加载并显示已保存的对应关系列表
function cmLoadMappingList() {
  var listEl = document.getElementById('cmMappingList');
  if (!listEl) return;
  var localList = JSON.parse(localStorage.getItem('cmCustomMappings') || '[]');
  // 同时从OSS读取
  var raw = localStorage.getItem('friendshipTool_sharedData');
  var ossMappings = [];
  if (raw) {
    try {
      var sd = JSON.parse(raw);
      if (sd.factoryColorMap) {
        Object.keys(sd.factoryColorMap).forEach(function(key) {
          var info = sd.factoryColorMap[key];
          ossMappings.push({
            colorCardNo: info.colorCardNo || '',
            factoryName: info.factoryName || '',
            factoryCode: info.factoryCode,
            colorNo: info.factoryColor || '',
            factoryColor: info.factoryColor || '',
            source: info.updatedBy === 'tutuCollab' ? '手动编' : '云端',
            time: info.updatedAt ? new Date(info.updatedAt).toLocaleString() : ''
          });
        });
      }
    } catch(e) {}
  }
  // 合并去重
  var allMappings = ossMappings.slice();
  localList.forEach(function(item) {
    if (!allMappings.find(function(m) { return m.factoryCode === item.factoryCode && m.colorNo === item.colorNo; })) {
      allMappings.push(item);
    }
  });
  if (allMappings.length === 0) {
    listEl.innerHTML = '<div style="font-size:11px;color:#999;text-align:center;padding:4px;">暂无对应关系记录</div>';
    return;
  }
  var html = '<table style="width:100%;font-size:12px;border-collapse:collapse;">';
  html += '<tr style="background:#e9ecef;"><th style="padding:4px 6px;text-align:left;border-bottom:1px solid #ddd;">色卡编号</th><th style="padding:4px 6px;text-align:left;border-bottom:1px solid #ddd;">工厂名称</th><th style="padding:4px 6px;text-align:left;border-bottom:1px solid #ddd;">工厂编号</th><th style="padding:4px 6px;text-align:center;border-bottom:1px solid #ddd;white-space:nowrap;">来源</th><th style="padding:4px 6px;text-align:center;border-bottom:1px solid #ddd;">操作</th></tr>';
  allMappings.forEach(function(m, idx) {
    var srcTag = m.source === '手动编' ? '<span style="background:#fff3cd;color:#856404;padding:1px 5px;border-radius:3px;font-size:10px;white-space:nowrap;">手动编</span>' : '<span style="background:#d4edda;color:#155724;padding:1px 5px;border-radius:3px;font-size:10px;white-space:nowrap;">云端</span>';
    html += '<tr><td style="padding:3px 6px;">' + (m.colorCardNo || '-') + '</td><td style="padding:3px 6px;">' + (m.factoryName || '-') + '</td><td style="padding:3px 6px;">' + (m.factoryCode || '-') + '</td><td style="padding:3px 6px;text-align:center;white-space:nowrap;">' + srcTag + '</td><td style="padding:3px 6px;text-align:center;white-space:nowrap;"><button onclick="cmEditMapping(' + idx + ')" style="padding:2px 8px;background:#1677ff;color:#fff;border:none;border-radius:3px;font-size:11px;cursor:pointer;">编辑</button><button onclick="cmDeleteMapping(' + idx + ')" style="padding:2px 8px;background:#dc3545;color:#fff;border:none;border-radius:3px;font-size:11px;cursor:pointer;margin-left:4px;">删除</button></td></tr>';
  });
  html += '</table>';
  listEl.innerHTML = html;
  // 存储记录供编辑使用
  window._cmMappings = allMappings;
}

// 编辑记录：把数据填回输入框
function cmEditMapping(idx) {
  var m = window._cmMappings[idx];
  if (!m) return;
  document.getElementById('cmSelfColorCardNo').value = m.colorCardNo || '';
  document.getElementById('cmSelfFactoryName').value = m.factoryName || '';
  document.getElementById('cmSelfFactoryCode').value = m.factoryCode || '';
  showToast('已填入编辑，修改后点保存对应');
  // 滚动到顶部
  document.getElementById('cmSelfColorCardNo').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// 删除记录：弹确认框，删了云端表格里也同步删
function cmDeleteMapping(idx) {
  var m = window._cmMappings[idx];
  if (!m) return;
  var ok = confirm('确定删除这条对应吗？\n\n色卡编号：' + (m.colorCardNo || '-') + '\n工厂名称：' + (m.factoryName || '-') + '\n工厂编号：' + (m.factoryCode || '-') + '\n\n删除后云端表格里也会同步删除');
  if (!ok) return;

  // 1. 删本地映射列表（cmCustomMappings）
  try {
    var localList = JSON.parse(localStorage.getItem('cmCustomMappings') || '[]');
    localList = localList.filter(function(item) {
      return !(item.colorCardNo === m.colorCardNo && item.factoryCode === m.factoryCode);
    });
    localStorage.setItem('cmCustomMappings', JSON.stringify(localList));
  } catch(e) { console.error(e); }

  // 2. 删云端共享数据里的自编产品
  try {
    if (typeof FriendshipSync !== 'undefined') {
      var data = FriendshipSync.getSharedData();
      if (data.products && data.products[m.colorCardNo]) {
        delete data.products[m.colorCardNo];
      }
      FriendshipSync.saveSharedData(data);
    }
  } catch(e) { console.error(e); }

  // 3. 删 userProducts 里的自编产品（让搜索不再出现）
  try {
    var up = JSON.parse(localStorage.getItem('userProducts') || '{}');
    if (up[m.colorCardNo]) {
      delete up[m.colorCardNo];
      localStorage.setItem('userProducts', JSON.stringify(up));
      if (typeof userProducts !== 'undefined') userProducts = up;
    }
  } catch(e) { console.error(e); }

  // 4. 同步上传到OSS
  if (typeof uploadSharedDataToOSS === 'function') {
    uploadSharedDataToOSS().catch(function(e) { console.error(e); });
  }

  // 5. 刷新记录列表 + 隐藏“刚保存的对应”
  cmLoadMappingList();
  var lastSavedEl = document.getElementById('cmLastSaved');
  if (lastSavedEl) lastSavedEl.style.display = 'none';
  showToast('🗑️ 已删除');
}

function cmAddColorRow() {
  var tableEl = document.getElementById('cmColorTable');
  // Remove empty tip if present
  var tip = tableEl.querySelector('.cm-empty-tip');
  if (tip) tip.remove();

  // 自动递增编号：找最后一个有数字的色号
  var nextNum = 1;
  var allRows = tableEl.querySelectorAll('.cm-color-row');
  allRows.forEach(function(r) {
    var ccInput = r.querySelector('.cm-customer-color');
    if (ccInput) {
      var val = (ccInput.tagName === 'INPUT' ? ccInput.value : ccInput.textContent).trim();
      var match = val.match(/(\d+)/);
      if (match) {
        var n = parseInt(match[1]);
        if (n >= nextNum) nextNum = n + 1;
      }
    }
  });
  var autoCode = String(nextNum);

  var row = document.createElement('div');
  row.className = 'cm-color-row';
  row.innerHTML = '<input class="cm-customer-color" type="text" value="' + autoCode + '" placeholder="客户色号 如 1#" style="border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:14px;font-weight:normal;flex:1;min-width:0;">' +
    '<input class="cm-factory-input" type="text" placeholder="工厂色号" data-cc="__new__">' +
    '<button class="cm-del-btn" onclick="cmDelRow(this)" title="删除">✕</button>';
  tableEl.appendChild(row);
  row.querySelector('.cm-factory-input').focus();
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cmDelRow(btn) {
  btn.parentElement.remove();
}

// 色号输入框失去焦点时自动保存
function cmAutoSaveColor(inputEl) {
  var colorNo = inputEl.getAttribute('data-cc');
  var factoryColor = inputEl.value.trim();
  if (!colorNo || !factoryColor) return;
  if (!cmCurrentCode) return;
  // 更新到 userColors
  if (!userColors[cmCurrentCode]) userColors[cmCurrentCode] = {};
  userColors[cmCurrentCode][colorNo] = factoryColor;
  localStorage.setItem('userColors', JSON.stringify(userColors));
  // 同步到 FriendshipSync
  if (typeof FriendshipSync !== 'undefined' && FriendshipSync.syncColors) {
    var syncColors = {};
    syncColors[cmCurrentCode] = {
      colorCode: cmCurrentCode,
      colors: userColors[cmCurrentCode],
      updatedBy: 'tutuCollab',
      updatedAt: new Date().toISOString()
    };
    FriendshipSync.syncColors(syncColors);
  }
  showToast('✅ ' + colorNo + ' → ' + factoryColor);
}

function cmSaveColors() {
  if (!cmCurrentCode) {
    showToast('⚠️ 请先选择一个产品');
    return;
  }
  var tableEl = document.getElementById('cmColorTable');
  var rows = tableEl.querySelectorAll('.cm-color-row');
  var newMap = {};
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var ccEl = row.querySelector('.cm-customer-color');
    var fcEl = row.querySelector('.cm-factory-input');
    var cc, fc;
    if (ccEl.tagName === 'INPUT') {
      cc = ccEl.value.trim();
    } else {
      cc = ccEl.textContent.trim();
    }
    fc = fcEl.value.trim();
    if (cc && fc) {
      newMap[cc] = fc;
    }
  }
  userColors[cmCurrentCode] = newMap;
  localStorage.setItem('userColors', JSON.stringify(userColors));
  
  // === 同步色号到共享存储 ===
  if (typeof FriendshipSync !== 'undefined' && cmCurrentCode) {
    var syncColors = {};
    syncColors[cmCurrentCode] = {
      colorCode: cmCurrentCode,
      colorMap: newMap,
      updatedBy: 'sampleTool',
      updatedAt: new Date().toISOString()
    };
    FriendshipSync.syncBatch(null, syncColors, null);
  }
  
  showToast('✅ 色号已保存: ' + cmCurrentCode + ' (' + Object.keys(newMap).length + '个色号)');
}

function cmExportColors() {
  var data = JSON.stringify(userColors, null, 2);
  if (!data || data === '{}') {
    showToast('⚠️ 暂无用户色号数据可导出');
    return;
  }
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'userColors_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📤 色号数据已导出');
}

// ===== FORM STATE SAVE/RESTORE =====
function saveFormState() {
  var entries = [];
  document.querySelectorAll('.entry-card').forEach(function(card) {
    var entry = {};
    entry.productCode = card.querySelector('.product-search')?.value.trim() || '';
    entry.customerSuffix = card.querySelector('.customer-suffix')?.value.trim() || '';
    entry.factoryIdx = card.querySelector('.selected-factory-idx')?.value || '0';
    var unitRadio = card.querySelector('input[type="radio"][name^="unit-"]:checked');
    entry.unit = unitRadio ? unitRadio.value : '米';
    entry.colors = [];
    card.querySelectorAll('.color-entry-row').forEach(function(row) {
      var color = {
        colorNum: row.querySelector('.color-input')?.value || '',
        qty: row.querySelector('.qty-input')?.value || '',
        factoryColor: row.querySelector('.factory-color-input')?.value || '',
        requirement: row.querySelector('.req-input')?.value || ''
      };
      entry.colors.push(color);
    });
    entries.push(entry);
  });
  var state = {
    customerName: document.getElementById('customerName').value.trim(),
    customerTitle: document.getElementById('customerTitle').value.trim(),
    entries: entries
  };
  localStorage.setItem('lastFormState', JSON.stringify(state));
}

function restoreFormState() {
  var raw = localStorage.getItem('lastFormState');
  if (!raw) return;
  try {
    var state = JSON.parse(raw);
    if (state.customerName) document.getElementById('customerName').value = state.customerName;
    if (state.customerTitle) document.getElementById('customerTitle').value = state.customerTitle;
    if (state.entries && state.entries.length > 0) {
      state.entries.forEach(function(entry) {
        addEntry();
        var cards = document.querySelectorAll('.entry-card');
        var card = cards[cards.length - 1];
        var searchInput = card.querySelector('.product-search');
        if (searchInput && entry.productCode) {
          searchInput.value = entry.productCode;
          // Trigger search to restore factory
          var inputEvent = new Event('input', { bubbles: true });
          searchInput.dispatchEvent(inputEvent);
        }
        if (entry.customerSuffix) {
          var suffixInput = card.querySelector('.customer-suffix');
          if (suffixInput) suffixInput.value = entry.customerSuffix;
        }
        if (entry.unit && entry.unit !== '米') {
          var radio = card.querySelector('input[type="radio"][name^="unit-"][value="' + entry.unit + '"]');
          if (radio) radio.checked = true;
        }
        if (entry.colors) {
          var colorsContainer = card.querySelector('[id^="colors-"]');
          if (colorsContainer) {
            colorsContainer.innerHTML = '';
            entry.colors.forEach(function(color) {
              var row = document.createElement('div');
              var cid = ++colorRowCounter;
              row.className = 'color-entry-row';
              row.id = 'colorrow-' + cid;
              row.setAttribute('data-entry', entryCounter);
              row.innerHTML = '<div class="entry-col-3"><input type="text" class="color-input" placeholder="色号" data-entry="' + entryCounter + '" data-cid="' + cid + '" onblur="autoAddHash(this)" value="' + (color.colorNum || '') + '"></div>' +
                '<div class="entry-col-3"><input type="number" class="qty-input" placeholder="数量" data-entry="' + entryCounter + '" data-cid="' + cid + '" value="' + (color.qty || '') + '"></div>' +
                '<div class="entry-col-3"><input type="text" class="factory-color-input" placeholder="工厂色号" data-entry="' + entryCounter + '" data-cid="' + cid + '" value="' + (color.factoryColor || '') + '"></div>' +
                '<div class="entry-col-3"><input type="text" class="req-input" placeholder="要求" data-entry="' + entryCounter + '" data-cid="' + cid + '" value="' + (color.requirement || '') + '"></div>';
              colorsContainer.appendChild(row);
            });
          }
        }
      });
    }
  } catch(e) {}
}

// Restore form state on page load
(function() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', restoreFormState);
  } else {
    setTimeout(restoreFormState, 100);
  }
})();

// Close color mgmt on overlay click
document.getElementById('colorMgmtModal').addEventListener('click', function(e) {
  if (e.target === this) closeColorMgmt();
});
</script>
